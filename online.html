<style>
/* =====================================================================
   HEART STRIKE スタイル
   上から順に「1つの部品は1か所で定義」。テーマを後ろへ重ね塗りしない。
   !important は [hidden] / Debug 表示 / 長押し演出 の3か所だけ。

    0. トークン(色・フォント・寸法)
    1. ベース / 画面枠 / safe-area
    2. インゲーム HUD          ※調整済み。ゲームの見た目に直結するので変更しない
    3. インゲーム演出(カットイン・FEVER・会話・LOVE MAX・ステージ開始)
    4. 開発用(Debug・調整パネル・当たり判定)
    5. アプリ共通(下部ナビ・シート・トースト)
    6. HOME
    7. 汎用画面(育成・コレクション・ミッション・プレゼント・設定)+ キャラクターカード
    8. 攻略フロー(攻略・難易度・編成・先頭キャラ・リザルト)
    9. キャラクター詳細
   10. ガチャ
   11. MULTI ロビー
   ===================================================================== */

/* ---- 0. トークン ---- */
:root {
  /* インゲーム(調整済み。値を変えるとインゲームの見た目が変わる)*/
  --night: #050507;
  --ink: #f7f7fa;
  --dim: #9696a3;
  --boss: #ff3f8f;
  --gold: #f2d28b;
  --panel: rgba(12,12,16,.82);
  --display: "Dela Gothic One", "Arial Black", "Hiragino Sans", sans-serif;
  --body: "M PLUS 1p", "Hiragino Sans", "Noto Sans JP", system-ui, sans-serif;

  /* アプリ(HOME / 育成 / 攻略 / ガチャ / コレクション):かわいいギャルゲー × ソシャゲ */
  --round: "M PLUS Rounded 1c", "M PLUS 1p", "Hiragino Maru Gothic ProN", "Hiragino Sans", system-ui, sans-serif;
  --hs-ink: #5b2b45;            /* 本文(ワインブラウン。黒は使わない)*/
  --hs-ink-soft: #9b6f87;       /* 補助文字 */
  --hs-pink: #ff5fa2;
  --hs-pink-deep: #ec3f8a;
  --hs-pink-soft: #ffd6e8;
  --hs-pink-pale: #fff0f6;
  --hs-lav: #b9a3ff;
  --hs-lav-soft: #efe7ff;
  --hs-cream: #fffaf3;
  --hs-mint: #3fbf93;
  --hs-rosegold: #e7a8b5;       /* ピンクゴールド:枠・飾りのアクセントだけ */
  /* 役割の色:仲間(味方)= ピンク / 攻略対象 = ラベンダー。どの画面でも同じ色で見分ける */
  --ally: #ff5fa2; --ally-soft: #ffe1ee;
  --heroine: #8b6cf0; --heroine-soft: #ece6ff;
  --hs-panel: rgba(255,255,255,.82);
  --hs-panel-strong: rgba(255,255,255,.95);
  --hs-line: rgba(231,168,181,.62);
  --hs-line-soft: rgba(231,168,181,.32);
  --hs-shadow: 0 8px 22px rgba(205,84,140,.16);
  --hs-shadow-lg: 0 14px 34px rgba(205,84,140,.24);
  --hs-cta: linear-gradient(135deg, #ff86b9 0%, #ff4f9a 55%, #c08bff 100%);
  --hs-bg: radial-gradient(ellipse 90% 42% at 50% 0%, rgba(255,255,255,.95), rgba(255,255,255,0) 70%),
           linear-gradient(180deg, #fff4f9 0%, #ffe6f1 50%, #f1e6ff 100%);
  --hs-sparkle: radial-gradient(circle at 16% 20%, rgba(255,140,190,.55) 0 1.2px, transparent 2px),
                radial-gradient(circle at 80% 30%, rgba(255,255,255,.95) 0 1.4px, transparent 2.2px),
                radial-gradient(circle at 62% 74%, rgba(185,163,255,.55) 0 1.2px, transparent 2px);
  color-scheme: dark;
}

/* ---- 1. ベース / 画面枠 ---- */
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; }
@supports (height: 100dvh) { html, body { height: 100dvh; } }   /* iPhone Safari:アドレスバーの伸縮に追従 */
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body {
  background: #f6e6ef; color: var(--ink); font-family: var(--body);
  overflow: hidden; overscroll-behavior: none; position: fixed; inset: 0; width: 100%;
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent;
}
button { touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
#game {
  position: relative; height: 100%; aspect-ratio: 9 / 19.5; max-width: 100%; margin: 0 auto;
  overflow: hidden; touch-action: none; background: var(--night);
  box-shadow: 0 0 0 1px rgba(255,255,255,.08), 0 28px 90px #000;
  --sat: env(safe-area-inset-top, 0px); --sab: env(safe-area-inset-bottom, 0px);
  --sal: env(safe-area-inset-left, 0px); --sar: env(safe-area-inset-right, 0px);
  --navh: 82px;                 /* 下部ナビの高さ(safe-area を除く)。ナビより下に置く UI はこれを基準にする */
}
/* スマホ(iPhone 等のタッチ端末):画面いっぱいに表示(縦横比は 9:16 より細ければそのまま使う) */
@media (pointer: coarse) {
  #game { aspect-ratio: auto; width: 100%; max-width: calc(100vh * 0.6); }
  @supports (height: 100dvh) { #game { max-width: calc(100dvh * 0.6); } }
}
/* 3D 画面にうっすら掛かる光(インゲームの見た目の一部)*/
#game::after { content: ""; position: absolute; inset: 0; z-index: 0; pointer-events: none; background: radial-gradient(circle at 50% -8%, rgba(255,255,255,.08), transparent 30%), linear-gradient(180deg, rgba(255,255,255,.018), transparent 25%); }
/* スマホを横向きにした時 */
#rotateHint { display: none; }
@media (pointer: coarse) and (orientation: landscape) and (max-height: 540px) {
  #rotateHint { display: grid; position: fixed; inset: 0; z-index: 100; place-items: center; text-align: center; background: rgba(10,7,20,.94); color: var(--ink); font-family: var(--display); font-size: 20px; line-height: 1.6; }
}

/* ---- 2. インゲーム HUD(調整済み・変更しない)---- */
/* 上部:推しの名前 + LOVE + RALLY / 判定 / 操作ヒント / 手番 / Catch Marker / 部位 / ダメージ / POWER / SPECIAL / 右下のパーティ */
#game canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
#ui { position: absolute; inset: 0; pointer-events: none; }

/* ---- ボスHP ---- */
/* ---- 上部:推しの名前 + HEART + RALLY(中央寄せ・コンパクト) ---- */
.bossbar { position: absolute; top: calc(8px + env(safe-area-inset-top, 0px)); left: 50%; transform: translateX(-50%); width: min(82%, 340px); text-align: center;
  padding: 10px 13px 9px; border: 1px solid rgba(255,255,255,.12); border-radius: 18px; background: linear-gradient(180deg, rgba(13,13,18,.84), rgba(5,5,8,.64)); box-shadow: 0 12px 35px rgba(0,0,0,.35), inset 0 1px rgba(255,255,255,.08); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); }
.bossbar .name { font-family: var(--display); font-size: 13px; letter-spacing: .12em; color: var(--ink); text-shadow: 0 1px 10px #000; }
.bossbar .name .hm { color: #ff7ab8; margin-right: 4px; }
.heartrow { display: grid; grid-template-columns: auto 1fr auto; gap: 6px; align-items: center; margin-top: 6px; }
.heartrow span { font-family: var(--display); font-size: 9px; color: #ff78b3; letter-spacing: .08em; }
.heartrow b { font-family: var(--display); font-weight: 400; font-size: 13px; color: #fff; min-width: 38px; text-align: right; font-variant-numeric: tabular-nums; text-shadow: 0 1px 0 #000; }
.track { position: relative; height: 8px; border-radius: 6px; background: #17171d; border: 0; box-shadow: inset 0 1px 3px #000, 0 0 0 1px rgba(255,255,255,.08); overflow: hidden; }
.track i { position: absolute; inset: 0; transform-origin: left; transform: scaleX(0); }
#heartFill { background: linear-gradient(90deg, #a81755, #ff3f8f 48%, #ff91c2); box-shadow: 0 0 14px rgba(255,63,143,.5); transition: transform 300ms ease-out; }
#heartBar.bump .track { animation: hbump 360ms ease-out; }
#heartBar.full .track { box-shadow: 0 0 0 1px #fff, 0 0 18px #ff4fa8; }
@keyframes hbump { 0% { box-shadow: 0 0 0 2px #fff, 0 0 18px #ff4fa8; } 100% { box-shadow: 0 0 0 1px #ff9ccc55; } }

/* ---- RALLY(HEART 直下・小さく。増えた時だけポップ) ---- */
/* COMBO(ボスへの攻撃の連続 HIT → FEVER ゲージ)。0 の間は出さない */
#combo { margin-top: 5px; display: flex; gap: 3px; justify-content: center; align-items: baseline; font-family: var(--display); color: #ffd0ea; letter-spacing: .04em; opacity: 1; transition: opacity .25s; }
#combo[data-n="0"] { opacity: 0; }
#combo .cb-h { font-style: normal; color: #ff5fa2; font-size: 11px; text-shadow: 0 0 6px rgba(255,95,162,.8); }
#combo b { font-size: 16px; color: #fff; font-variant-numeric: tabular-nums; text-shadow: 0 0 8px #ff5fa2, 0 1px 0 #000; }
#combo span { font-size: 9px; color: #ffb3dc; }
#combo.pop b { animation: pop 380ms ease-out; }
#combo.pop .cb-h { animation: cbBeat 380ms ease-out; }
#combo.broke { animation: cbBreak 450ms ease-in forwards; }
@keyframes cbBeat { 40% { transform: scale(1.6); } }
@keyframes cbBreak { 0% { opacity: 1; transform: none; filter: none; } 30% { transform: translateX(-3px) rotate(-4deg); filter: grayscale(1); } 60% { transform: translateX(3px) rotate(3deg); } 100% { opacity: 0; transform: translateY(6px) scale(.8); filter: grayscale(1); } }
/* HUD へ飛ぶチップ(Diamond → SPECIAL / COMBO → FEVER)*/
.flychip { position: absolute; z-index: 30; pointer-events: none; white-space: nowrap; will-change: transform, opacity; }
.flychip.diamond .dia { display: block; font-style: normal; font-size: 22px; line-height: 1; color: #fff; text-shadow: 0 0 6px #fff, 0 0 14px #7fe6ff, 0 0 22px #ff9ad5; }
.flychip.combo { padding: 3px 10px 4px; border-radius: 999px; background: linear-gradient(135deg, rgba(255,140,198,.95), rgba(224,57,138,.95)); color: #fff; font: 900 11px var(--display); letter-spacing: .04em; box-shadow: 0 0 12px rgba(255,90,170,.7), 0 0 0 1.5px rgba(255,255,255,.8) inset; text-align: center; }
.flychip.combo b { font-size: 15px; margin-right: 2px; }
.flychip.combo small { display: block; font-size: 8px; color: #fff3b0; letter-spacing: .06em; }
@keyframes pop { 0% { transform: scale(2.2); } 100% { transform: scale(1); } }
@keyframes broke { 0%, 60% { color: var(--boss); transform: translateX(-4px); } 30% { transform: translateX(4px); } 100% { transform: none; } }

/* ---- 判定 ---- */
.judge { position: absolute; left: 0; right: 0; top: 36%; text-align: center; font-family: var(--display); font-size: 52px; letter-spacing: 0.02em; color: var(--jc, #fff); opacity: 0; text-shadow: 0 4px 18px #000, 0 0 24px color-mix(in srgb, var(--jc, #fff) 45%, transparent); -webkit-text-stroke: 1px rgba(0,0,0,.8); }
.judge.show { animation: judge 900ms cubic-bezier(.2,1.6,.4,1) forwards; }
.judge.perfect { font-size: 60px; }
.judge.tier { font-size: 34px; top: 24%; }
.judge.fevermax { font-size: 48px; top: 26%; color: #fff; -webkit-text-stroke: 1.5px #ff3f96; text-shadow: 0 0 14px #ff5fa2, 0 0 30px #ffd23e, 0 4px 12px rgba(80,0,40,.6); }
.judge.fevermax.show { animation: judgeFever 1300ms cubic-bezier(.2,1.6,.4,1) forwards; }
@keyframes judgeFever { 0% { opacity: 0; transform: scale(2.2); } 18% { opacity: 1; transform: scale(.94); } 28% { transform: scale(1.04); } 80% { opacity: 1; transform: scale(1); } 100% { opacity: 0; transform: scale(1.12); } }
.judge.specialready { font-size: 32px; top: 58%; color: #fff6c8; -webkit-text-stroke: 1px #c98a00; text-shadow: 0 0 12px #ffd23e, 0 0 24px #ff9ad5; }
.judge small { display: block; font-family: var(--body); font-weight: 800; font-size: 14px; -webkit-text-stroke: 0; color: #fff; text-shadow: 0 1px 3px #000; }
@keyframes judge { 0% { opacity: 0; transform: scale(2.4); } 12% { opacity: 1; transform: scale(1); } 75% { opacity: 1; transform: scale(1.04); } 100% { opacity: 0; transform: scale(1.1) translateY(-16px); } }

/* ---- 操作プロンプト ---- */
#prompt { position: absolute; left: 0; right: 0; top: 73%; text-align: center; --pc: #fff; }
#promptMain { font-family: var(--display); font-size: 34px; color: var(--pc); -webkit-text-stroke: 1.5px #000; text-shadow: 0 3px 0 #000; animation: breathe 700ms ease-in-out infinite alternate; }
#promptSub { font-size: 12px; font-weight: 800; color: var(--ink); opacity: 0.85; text-shadow: 0 1px 2px #000; }
#prompt[data-type^="catch"] { top: auto; bottom: 96px; }
#prompt[data-type="grab"] #promptMain { animation: none; }
@keyframes breathe { from { transform: scale(1); } to { transform: scale(1.1); } }

/* スワイプのヒント(指が上へ) */
#swipeHint { position: absolute; left: 0; top: 0; width: 0; height: 0; }
#swipeHint::before { content: ""; position: absolute; left: -3px; bottom: 0; width: 6px; height: 120px; border-radius: 3px; background: linear-gradient(to top, transparent, rgba(255,255,255,.75)); animation: swipe 1.3s ease-in infinite; transform-origin: bottom; }
#swipeHint::after { content: ""; position: absolute; left: -20px; top: -20px; width: 40px; height: 40px; border-radius: 50%; border: 3px solid #fff; background: rgba(255,255,255,.18); box-shadow: 0 0 0 2px rgba(0,0,0,.4); animation: finger 1.3s ease-in infinite; }
#swipeHint.nudge::after { animation: nudge 450ms ease-out; border-color: var(--gold); }
@keyframes nudge { 0% { transform: scale(2.2); opacity: 1; } 100% { transform: scale(1); opacity: 1; } }
@keyframes swipe { 0%, 45% { transform: scaleY(0); opacity: 0; } 75% { opacity: 1; } 100% { transform: scaleY(1) translateY(-40px); opacity: 0; } }
@keyframes finger { 0% { transform: scale(1.3); opacity: 0; } 25% { opacity: 1; transform: scale(1); } 45% { transform: translateY(0); opacity: 1; } 100% { transform: translateY(-150px); opacity: 0; } }

/* ---- 手番バナー ---- */
#turnBanner { position: absolute; left: 0; right: 0; top: 46%; height: 64px; display: grid; place-items: center; opacity: 0; --pc: #fff; background: linear-gradient(90deg, transparent, color-mix(in srgb, var(--pc) 85%, #000) 20%, color-mix(in srgb, var(--pc) 85%, #000) 80%, transparent); }
#turnName { font-family: var(--display); font-size: 30px; color: #fff; -webkit-text-stroke: 1.5px #000; text-shadow: 0 3px 0 #000; line-height: 1; text-align: center; }
#turnName small { display: block; font-size: 12px; letter-spacing: 0.3em; -webkit-text-stroke: 0; }
#turnBanner.show { animation: banner 850ms ease-out forwards; }
#ui.afterglow > :not(#talkBox):not(#bossLine):not(#clearFx):not(#loveMax):not(#menu):not(#inspector):not(#debug) { opacity: 0; transition: opacity .9s ease; pointer-events: none; }
#clearFx { position: absolute; inset: 0; z-index: 12; pointer-events: none; display: grid; place-items: center; }
#clearFx > div { position: absolute; left: 0; right: 0; top: 40%; text-align: center; opacity: 0; color: #fff; font-family: var(--display); }
#clearFx .cf-complete b { display: block; font-weight: 400; font-size: clamp(34px, 10vw, 56px); letter-spacing: .08em; color: #fff; text-shadow: 0 0 18px #ff3f8f, 0 0 42px #ff3f8f, 0 3px 0 #7a0035; }
#clearFx .cf-complete span { display: inline-block; margin-top: 6px; font-size: clamp(16px, 4.6vw, 22px); letter-spacing: .5em; padding: 4px 4px 4px 18px; border-top: 1px solid rgba(255,255,255,.6); border-bottom: 1px solid rgba(255,255,255,.6); text-shadow: 0 0 10px #ff5fa2; }
#clearFx .cf-complete.show { animation: cfIn 900ms cubic-bezier(.2,1.4,.4,1) forwards; }
#clearFx .cf-complete.show.up { animation: none; opacity: 1; translate: 0 -64px; scale: .8; transition: translate .6s ease, scale .6s ease; }
#clearFx.hell .cf-complete b { text-shadow: 0 0 18px #b01030, 0 0 46px #ff2040, 0 3px 0 #300; }
#clearFx .cf-asmr { top: 52%; }
#clearFx .cf-asmr small { display: block; font-size: 11px; letter-spacing: .3em; color: #ffd23e; text-shadow: 0 0 4px #000, 0 1px 3px #000; }
#clearFx .cf-asmr b { display: inline-block; margin: 4px 0; padding: 8px 22px; font-weight: 400; font-size: clamp(22px, 7vw, 34px); letter-spacing: .1em; color: #2a0010; background: linear-gradient(90deg, #ffd23e, #fff2b0, #ffd23e); border-radius: 999px; box-shadow: 0 0 0 2px #000, 0 0 30px rgba(255,210,62,.85); }
#clearFx .cf-asmr .cf-title { display: block; font-size: 13px; color: #ffe6f1; text-shadow: 0 1px 6px #000; }
#clearFx .cf-asmr.show { animation: cfAsmr 1100ms ease-out forwards; }
@keyframes cfIn { 0% { opacity: 0; scale: 1.8; filter: blur(6px); } 60% { opacity: 1; scale: .95; filter: none; } 100% { opacity: 1; scale: 1; } }
@keyframes cfAsmr { 0% { opacity: 0; translate: 0 18px; } 40% { opacity: 1; translate: 0 0; } 55% { scale: 1.06; } 100% { opacity: 1; scale: 1; } }
#atkLevel { position: absolute; left: 50%; top: calc(env(safe-area-inset-top) + 74px); transform: translateX(-50%); z-index: 6; pointer-events: none; opacity: 0; text-align: center; font-family: var(--display); color: #fff; padding: 5px 14px 6px; border-radius: 12px; background: rgba(20,8,24,.72); border: 1px solid rgba(255,95,162,.6); box-shadow: 0 4px 16px rgba(0,0,0,.4); white-space: nowrap; }
#atkLevel small { display: block; font-size: 9px; letter-spacing: .18em; color: #ff9cc6; }
#atkLevel b { font-weight: 400; font-size: 17px; letter-spacing: .12em; }
#atkLevel i { font-style: normal; color: rgba(255,255,255,.35); }
#atkLevel i.on { color: #ffd23e; text-shadow: 0 0 8px rgba(255,210,62,.8); }
#atkLevel.max { background: linear-gradient(90deg, rgba(120,0,40,.88), rgba(60,0,70,.88)); border-color: #ffd23e; box-shadow: 0 0 22px rgba(255,61,127,.7); }
#atkLevel.max small { color: #ffd23e; }
#atkLevel.show { animation: atkLv var(--dur, 1.1s) ease-out forwards; }
#atkLevel.max.show { animation: atkLvMax var(--dur, 1.1s) ease-out forwards; }
@keyframes atkLv { 0% { opacity: 0; translate: 0 -8px; } 15%, 75% { opacity: 1; translate: 0 0; } 100% { opacity: 0; } }
@keyframes atkLvMax { 0% { opacity: 0; scale: 1.5; } 14% { opacity: 1; scale: .96; } 22%, 78% { opacity: 1; scale: 1; } 100% { opacity: 0; } }
@keyframes banner { 0% { opacity: 0; transform: scaleY(0) skewX(-10deg); } 15% { opacity: 1; transform: scaleY(1) skewX(-10deg); } 70% { opacity: 1; transform: translateX(0) skewX(-10deg); } 100% { opacity: 0; transform: translateX(40%) skewX(-10deg); } }

/* ---- Catch Marker(◎) ---- */
#catchMarker { position: absolute; left: 0; top: 0; width: 0; height: 0; --pc: #fff; }
#catchMarker span { position: absolute; left: 0; top: 0; border-radius: 50%; transform: translate(-50%, -50%); }
#cmZone { border: 2px dashed rgba(255,255,255,.35); background: radial-gradient(circle, rgba(255,255,255,.08), transparent 70%); }
#cmInner { border: 4px solid rgba(255,255,255,.95); box-shadow: 0 0 0 3px rgba(0,0,0,.5), inset 0 0 0 3px rgba(0,0,0,.4); }
#cmInner::after { content: ""; position: absolute; left: 50%; top: 50%; width: 10px; height: 10px; margin: -5px 0 0 -5px; border-radius: 50%; background: #fff; box-shadow: 0 0 0 2px #000; }
#cmOuter { border: 5px solid var(--pc); box-shadow: 0 0 16px var(--pc), 0 0 0 2px #000; }
#catchMarker.near #cmInner { border-color: var(--gold); box-shadow: 0 0 22px var(--gold), 0 0 0 3px #000; }
#catchMarker.hit #cmInner { border-color: var(--gold); transform: translate(-50%, -50%) scale(1.3); transition: transform 150ms; }
#catchMarker.miss #cmInner { border-color: var(--boss); }
/* ---- DEFENCE:文字を使わず形と動きで操作を見せる ---- */
/* HOLD:塗りつぶした「押す面」+ 外周のゴールの輪。押すと中心から外へメーターが溜まり、輪まで届いて光ったら離す */
#catchMarker[data-note="HOLD"] #cmOuter { --pc: #ffd23e; border-width: 8px; }
#catchMarker[data-note="HOLD"] #cmInner { border-color: #fff6cf; }
#catchMarker[data-note="HOLD"] #cmInner::after { width: 16px; height: 16px; margin: -8px 0 0 -8px; background: #ffd23e; }
#cmPad { background: radial-gradient(circle, rgba(255,240,170,.95), rgba(255,196,60,.75) 55%, rgba(255,160,20,.45)); box-shadow: 0 0 18px rgba(255,200,60,.7), inset 0 0 0 3px rgba(255,255,255,.55); animation: cmBreath 1.1s ease-in-out infinite; }
@keyframes cmBreath { 0%, 100% { scale: 1; opacity: .85; } 50% { scale: .9; opacity: 1; } }
#cmHold { --ring: rgba(255,255,255,.9); z-index: 1; box-sizing: border-box; border: 5px solid var(--ring); box-shadow: 0 0 0 2px rgba(0,0,0,.55), inset 0 0 0 2px rgba(0,0,0,.45); }
/* メーター:中心から外側へ溜まる円(--hk = 0..1。1 でゴールの輪にぴったり届く)。縁が明るいので「どこまで来たか」が見える */
#cmHold::before { content: ""; position: absolute; inset: 0; border-radius: 50%; background: radial-gradient(circle, rgba(255,236,150,.85), rgba(255,200,40,.92) 80%, #fff3b0 92%); box-shadow: 0 0 0 3px #fff, 0 0 12px rgba(255,210,62,.9); scale: var(--hk, 0); }
/* 押している間は押す面を暗くして、溜まっていくメーターとの境目をはっきり見せる */
#catchMarker.holding #cmPad { animation: none; scale: 1; background: radial-gradient(circle, rgba(70,45,0,.55), rgba(40,25,0,.7)); box-shadow: inset 0 0 0 3px rgba(255,214,80,.5); }
@keyframes cmPress { 0%, 100% { scale: .84; } 50% { scale: .92; } }
#catchMarker.holding #cmHold { filter: drop-shadow(0 0 calc(2px + 10px * var(--hk, 0)) #ffd23e); }
#catchMarker[data-note="HOLD"]:is(.holding, .ready, .early) #cmInner { opacity: 0; }
#catchMarker.holding #cmOuter, #catchMarker.holding #cmZone, #catchMarker.ready #cmOuter, #catchMarker.ready #cmZone, #catchMarker.early #cmOuter, #catchMarker.early #cmZone { opacity: 0; }
#catchMarker.ready #cmHold { --ring: #ffffff; filter: drop-shadow(0 0 16px #fff) drop-shadow(0 0 26px #ffd23e); animation: cmReady .32s ease-in-out infinite alternate; }
#catchMarker.ready #cmHold::before { background: radial-gradient(circle, #fffbe8, #ffe9a0 80%, #ffffff); }
@keyframes cmReady { to { scale: 1.12; } }
#catchMarker.ready #cmPad { animation: none; scale: .9; filter: brightness(1.5); }
#catchMarker.ready #cmPad::after { content: ""; position: absolute; left: 50%; top: 50%; width: 30%; height: 30%; margin: -10% 0 0 -15%; border-left: 5px solid #fff; border-top: 5px solid #fff; rotate: 45deg; animation: cmLift .45s ease-out infinite; filter: drop-shadow(0 0 4px #000); }
@keyframes cmLift { from { translate: 0 30%; opacity: 1; } to { translate: 0 -90%; opacity: 0; } }
#catchMarker.ready::before { content: ""; position: absolute; left: 0; top: 0; width: 120px; height: 120px; margin: -60px 0 0 -60px; border-radius: 50%; border: 3px solid #fff; animation: cmRipple .6s ease-out infinite; }
@keyframes cmRipple { from { scale: .5; opacity: .9; } to { scale: 1.5; opacity: 0; } }
#catchMarker.early #cmHold { --ring: #ff3d5a; animation: cmShake .3s ease-in-out 2; }
#catchMarker.early #cmHold::before { background: radial-gradient(circle, rgba(255,214,80,.5), rgba(255,140,60,.7) 85%, #ff3d5a); }
#catchMarker.early #cmPad { animation: none; filter: grayscale(.6) brightness(.8); }
@keyframes cmShake { 0%, 100% { translate: 0 0; } 25% { translate: -5px 0; } 75% { translate: 5px 0; } }
/* FLICK:osu! のスライダー。開始のヒットサークル(アプローチサークルが縮む)+ 縁取りの太いトラック + 終点のサークル。押すとボール(ハート)が進み、フォローサークルの中に指を保つ */
#catchMarker[data-note="FLICK"] #cmZone { display: none; }
#catchMarker[data-note="FLICK"] #cmOuter { --pc: #5ad8ff; border-width: 4px; box-shadow: 0 0 10px var(--pc); }
#catchMarker[data-note="FLICK"] #cmInner { border: 5px solid #fff; background: radial-gradient(circle, rgba(140,230,255,.12) 0 45%, rgba(40,170,230,.4) 80%, rgba(20,120,190,.6)); box-shadow: 0 0 0 2px rgba(0,0,0,.55), 0 0 14px rgba(90,216,255,.8); }
#catchMarker[data-note="FLICK"] #cmInner::after { display: none; }
#catchMarker[data-note="FLICK"].near #cmInner { border-color: #fff; box-shadow: 0 0 0 2px rgba(0,0,0,.55), 0 0 24px #fff, 0 0 30px #5ad8ff; }
#catchMarker.sliding #cmOuter, #catchMarker.sliding #cmZone, #catchMarker.sliding #cmInner { opacity: 0; transition: opacity .12s; }
#noteFx { position: absolute; left: 0; top: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none; }
#noteFx .nf-edge, #noteFx .nf-body, #noteFx .nf-core { fill: none; stroke-linecap: round; stroke-linejoin: round; }
#noteFx .nf-edge { stroke: #ffffff; filter: drop-shadow(0 0 1.5px rgba(0,0,0,.8)) drop-shadow(0 0 8px rgba(90,216,255,.6)); }
#noteFx .nf-body { stroke: rgb(18,70,110); stroke-opacity: .6; }
#noteFx .nf-core { stroke: rgb(90,200,245); stroke-opacity: .35; filter: blur(6px); }
#noteFx .nf-end { fill: none; stroke: rgba(255,255,255,.75); }
#noteFx .nf-end.reached { fill: rgba(255,210,62,.35); stroke: #fff6cf; filter: drop-shadow(0 0 10px #ffd23e); }
#noteFx .nf-ball, #noteFx .nf-follow { display: none; }
#noteFx .nf-path.active .nf-ball, #noteFx .nf-path.active .nf-follow { display: inline; }
#noteFx .nf-ball { fill: none; stroke: #ffffff; stroke-width: 4px; filter: drop-shadow(0 0 6px #5ad8ff); }
#noteFx .nf-follow { fill: rgba(255,255,255,.06); stroke: #ffffff; stroke-width: 3px; stroke-opacity: .85; filter: drop-shadow(0 0 8px #5ad8ff); transform-box: fill-box; transform-origin: center; animation: nfFollowIn .18s ease-out; }
@keyframes nfFollowIn { from { scale: .5; opacity: 0; } to { scale: 1; opacity: 1; } }
#noteFx .nf-path.fail .nf-edge { stroke: #ff3d5a; }
#noteFx .nf-path.fail .nf-body { stroke: rgb(90,20,35); }
#noteFx .nf-path.fail .nf-core { stroke: rgb(255,61,90); }
#noteFx .nf-path.fail .nf-end { stroke: #ff3d5a; }
/* MULTI:osu! のコンボ番号(押したら消える) */
#catchMarker #cmNum { border-radius: 0; font: 900 24px/1 var(--round, sans-serif); color: #fff; -webkit-text-stroke: 1px rgba(0,0,0,.6); text-shadow: 0 0 2px #000, 0 1px 3px rgba(0,0,0,.9), 0 0 10px var(--pc); pointer-events: none; }
#catchMarker:is(.holding, .ready, .early, .sliding, .hit, .miss) #cmNum { opacity: 0; transition: opacity .1s; }
#noteFx .nf-next-num { fill: #fff; font: 900 20px/1 var(--round, sans-serif); paint-order: stroke; stroke: rgba(0,0,0,.7); stroke-width: 3px; }
/* MULTI:次のハート(薄く) */
#noteFx .nf-next { opacity: .55; }
#noteFx .nf-next-ring { fill: none; stroke: #ffffff; stroke-width: 3px; stroke-dasharray: 5 5; }
#noteFx .nf-next-pad { fill: rgba(255,210,62,.7); }
#noteFx .nf-next-edge { fill: none; stroke: rgba(255,255,255,.8); stroke-linecap: round; }
#noteFx .nf-next-path { fill: none; stroke: rgb(18,70,110); stroke-linecap: round; }
#noteFx .nf-next-end { fill: none; stroke: #ffffff; stroke-width: 3px; }
.ripple { position: absolute; width: 16px; height: 16px; margin: -8px 0 0 -8px; border-radius: 50%; border: 3px solid var(--rc); animation: ripple 480ms ease-out forwards; }
@keyframes ripple { from { transform: scale(0.5); opacity: 1; } to { transform: scale(4); opacity: 0; } }

/* ---- 部位HUD ---- */
#partsWrap { position: absolute; top: 108px; left: 10px; width: 92px; padding: 5px 6px; background: rgba(20,14,38,.55); border-radius: 6px; }
#partsCount { font-family: var(--display); font-size: 10px; letter-spacing: .06em; color: var(--gold); margin-bottom: 3px; }
.prow { display: grid; grid-template-columns: 44px 1fr; align-items: center; gap: 4px; height: 12px; }
.pl { font-size: 8px; font-weight: 800; color: var(--dim); letter-spacing: .03em; }
.pb { height: 5px; background: #000; border-radius: 3px; overflow: hidden; }
.pb i { display: block; height: 100%; background: #7dffb0; transform-origin: left; transition: transform 250ms; }
.prow[data-state="WARM"] .pb i { background: #ff9ccc; }
.prow[data-state="HEART_MAX"] .pl { color: #ff7ab8; }
.prow.hit { animation: prowhit 400ms; }
@keyframes prowhit { 0% { background: rgba(255,255,255,.35); } 100% { background: transparent; } }
.callout { position: absolute; left: 0; right: 0; top: 46%; text-align: center; font-family: var(--display); font-size: 30px; color: #fff; -webkit-text-stroke: 1.5px #000; text-shadow: 0 3px 0 #000; opacity: 0; pointer-events: none; }
