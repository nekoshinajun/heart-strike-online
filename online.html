<title>HEART STRIKE ONLINE</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="HEART STRIKE">
<meta name="theme-color" content="#dff5ff">
<meta name="format-detection" content="telephone=no">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=M+PLUS+1p:wght@500;800&display=swap">
<style>
/* Layout: 縦長スマホ1画面。3Dキャンバス全面+DOMオーバーレイ(上:ボスHP / 左上:RALLY / 中央:判定 / 下:4人HP) */
:root {
  --night: #140f24;       /* アリーナの夜 */
  --ink: #f4f0ff;         /* 文字 */
  --dim: #a89cc8;         /* 補助文字 */
  --boss: #ff3d7f;        /* ボス/危険 */
  --gold: #ffd23e;        /* PERFECT・強調 */
  --panel: rgba(20, 14, 38, 0.72);
  --display: "Dela Gothic One", "Arial Black", "Hiragino Sans", sans-serif;
  --body: "M PLUS 1p", "Hiragino Sans", "Noto Sans JP", system-ui, sans-serif;
  color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; }
@supports (height: 100dvh) { html, body { height: 100dvh; } }   /* iPhone Safari:アドレスバーの伸縮に追従 */
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body {
  background: var(--night); color: var(--ink); font-family: var(--body);
  overflow: hidden; overscroll-behavior: none; position: fixed; inset: 0; width: 100%;
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent;
}
button { touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
#game {
  position: relative; height: 100%; aspect-ratio: 9 / 19.5; max-width: 100%; margin: 0 auto;
  overflow: hidden; touch-action: none; background: var(--night);
}
@media (min-aspect-ratio: 9/19.5) { #game { box-shadow: 0 0 0 1px #2c2150, 0 0 60px #000; } }
/* スマホ(iPhone 等のタッチ端末):画面いっぱいに表示(縦横比は 9:16 より細ければそのまま使う) */
@media (pointer: coarse) {
  #game { aspect-ratio: auto; width: 100%; max-width: calc(100vh * 0.6); box-shadow: none; }
  @supports (height: 100dvh) { #game { max-width: calc(100dvh * 0.6); } }
}
/* スマホを横向きにした時 */
#rotateHint { display: none; }
@media (pointer: coarse) and (orientation: landscape) and (max-height: 540px) {
  #rotateHint { display: grid; position: fixed; inset: 0; z-index: 100; place-items: center; text-align: center; background: rgba(10,7,20,.94); color: var(--ink); font-family: var(--display); font-size: 20px; line-height: 1.6; }
}
#game canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
#ui { position: absolute; inset: 0; pointer-events: none; }

/* ---- ボスHP ---- */
/* ---- 上部:推しの名前 + HEART + RALLY(中央寄せ・コンパクト) ---- */
.bossbar { position: absolute; top: calc(8px + env(safe-area-inset-top, 0px)); left: 50%; transform: translateX(-50%); width: min(74%, 300px); text-align: center; }
.bossbar .name { font-family: var(--display); font-size: 14px; letter-spacing: 0.06em; color: var(--ink); text-shadow: 0 2px 0 #000, 0 0 10px #ff5fa2; }
.bossbar .name .hm { color: #ff7ab8; margin-right: 4px; }
.heartrow { display: grid; grid-template-columns: auto 1fr auto; gap: 6px; align-items: center; margin-top: 3px; }
.heartrow span { font-family: var(--display); font-size: 10px; color: #ff9ccc; letter-spacing: .08em; }
.heartrow b { font-family: var(--display); font-weight: 400; font-size: 13px; color: #fff; min-width: 38px; text-align: right; font-variant-numeric: tabular-nums; text-shadow: 0 1px 0 #000; }
.track { position: relative; height: 11px; border-radius: 6px; background: rgba(40,10,30,.8); border: 1.5px solid #000; box-shadow: 0 0 0 1px #ff9ccc55; overflow: hidden; }
.track i { position: absolute; inset: 0; transform-origin: left; transform: scaleX(0); }
#heartFill { background: linear-gradient(90deg, #ff9ccc, #ff4fa8 60%, #ff2f86); transition: transform 300ms ease-out; }
#heartBar.bump .track { animation: hbump 360ms ease-out; }
#heartBar.full .track { box-shadow: 0 0 0 1px #fff, 0 0 18px #ff4fa8; }
@keyframes hbump { 0% { box-shadow: 0 0 0 2px #fff, 0 0 18px #ff4fa8; } 100% { box-shadow: 0 0 0 1px #ff9ccc55; } }

/* ---- RALLY(HEART 直下・小さく。増えた時だけポップ) ---- */
#rally { margin-top: 3px; --rc: #fff; font-family: var(--display); font-size: 11px; color: var(--dim); letter-spacing: .06em; display: flex; gap: 6px; justify-content: center; align-items: baseline; }
#rallyNum { font-size: 15px; color: var(--rc); text-shadow: 0 2px 0 #000; font-variant-numeric: tabular-nums; display: inline-block; }
#rallyMul { font-size: 10px; color: var(--rc); }
#rally.pop #rallyNum { animation: pop 380ms ease-out; }
#rally.broke #rallyNum { animation: broke 400ms ease-out; }
@keyframes pop { 0% { transform: scale(2.2); } 100% { transform: scale(1); } }
@keyframes broke { 0%, 60% { color: var(--boss); transform: translateX(-4px); } 30% { transform: translateX(4px); } 100% { transform: none; } }

/* ---- 判定 ---- */
.judge { position: absolute; left: 0; right: 0; top: 36%; text-align: center; font-family: var(--display); font-size: 52px; letter-spacing: 0.02em; color: var(--jc, #fff); opacity: 0; text-shadow: 0 4px 0 #000, 0 0 24px var(--jc, #fff); -webkit-text-stroke: 2px #000; }
.judge.show { animation: judge 900ms cubic-bezier(.2,1.6,.4,1) forwards; }
.judge.perfect { font-size: 60px; }
.judge.tier { font-size: 34px; top: 24%; }
.judge small { display: block; font-family: var(--body); font-weight: 800; font-size: 14px; -webkit-text-stroke: 0; color: #fff; text-shadow: 0 1px 3px #000; }
@keyframes judge { 0% { opacity: 0; transform: scale(2.4); } 12% { opacity: 1; transform: scale(1); } 75% { opacity: 1; transform: scale(1.04); } 100% { opacity: 0; transform: scale(1.1) translateY(-16px); } }

/* ---- 操作プロンプト ---- */
#prompt { position: absolute; left: 0; right: 0; top: 73%; text-align: center; --pc: #fff; }
#promptMain { font-family: var(--display); font-size: 34px; color: var(--pc); -webkit-text-stroke: 1.5px #000; text-shadow: 0 3px 0 #000; animation: breathe 700ms ease-in-out infinite alternate; }
#promptSub { font-size: 12px; font-weight: 800; color: var(--ink); opacity: 0.85; text-shadow: 0 1px 2px #000; }
#prompt[data-type="catch"] { top: auto; bottom: 96px; }
#prompt[data-type="grab"] #promptMain { animation: none; }
@keyframes breathe { from { transform: scale(1); } to { transform: scale(1.1); } }

/* スワイプのヒント(指が上へ) */
#swipeHint { position: absolute; left: 0; top: 0; width: 0; height: 0; }
#swipeHint::before { content: ""; position: absolute; left: -3px; bottom: 0; width: 6px; height: 120px; border-radius: 3px; background: linear-gradient(to top, transparent, rgba(255,255,255,.75)); animation: swipe 1.3s ease-in infinite; transform-origin: bottom; }
#swipeHint::after { content: ""; position: absolute; left: -20px; top: -20px; width: 40px; height: 40px; border-radius: 50%; border: 3px solid #fff; background: rgba(255,255,255,.18); box-shadow: 0 0 0 2px rgba(0,0,0,.4); animation: finger 1.3s ease-in infinite; }
#swipeHint.nudge::after { animation: nudge 450ms ease-out; border-color: var(--gold); }
@keyframes nudge { 0% { transform: scale(2.2); opacity: 1; } 100% { transform: scale(1); opacity: 1; } }
@keyframes swipe { 0%, 45% { transform: scaleY(0); opacity: 0; } 75% { opacity: 1; } 100% { transform: scaleY(1) translateY(-40px); opacity: 0; } }
@keyframes finger { 0% { transform: scale(1.3); opacity: 0; } 25% { opacity: 1; transform: scale(1); } 45% { transform: translateY(0); opacity: 1; } 100% { transform: translateY(-150px); opacity: 0; } }

/* ---- 手番バナー ---- */
#turnBanner { position: absolute; left: 0; right: 0; top: 46%; height: 64px; display: grid; place-items: center; opacity: 0; --pc: #fff; background: linear-gradient(90deg, transparent, color-mix(in srgb, var(--pc) 85%, #000) 20%, color-mix(in srgb, var(--pc) 85%, #000) 80%, transparent); }
#turnName { font-family: var(--display); font-size: 30px; color: #fff; -webkit-text-stroke: 1.5px #000; text-shadow: 0 3px 0 #000; line-height: 1; text-align: center; }
#turnName small { display: block; font-size: 12px; letter-spacing: 0.3em; -webkit-text-stroke: 0; }
#turnBanner.show { animation: banner 850ms ease-out forwards; }
@keyframes banner { 0% { opacity: 0; transform: scaleY(0) skewX(-10deg); } 15% { opacity: 1; transform: scaleY(1) skewX(-10deg); } 70% { opacity: 1; transform: translateX(0) skewX(-10deg); } 100% { opacity: 0; transform: translateX(40%) skewX(-10deg); } }

/* ---- Catch Marker(◎) ---- */
#catchMarker { position: absolute; left: 0; top: 0; width: 0; height: 0; --pc: #fff; }
#catchMarker span { position: absolute; left: 0; top: 0; border-radius: 50%; transform: translate(-50%, -50%); }
#cmZone { border: 2px dashed rgba(255,255,255,.35); background: radial-gradient(circle, rgba(255,255,255,.08), transparent 70%); }
#cmInner { border: 4px solid rgba(255,255,255,.95); box-shadow: 0 0 0 3px rgba(0,0,0,.5), inset 0 0 0 3px rgba(0,0,0,.4); }
#cmInner::after { content: ""; position: absolute; left: 50%; top: 50%; width: 10px; height: 10px; margin: -5px 0 0 -5px; border-radius: 50%; background: #fff; box-shadow: 0 0 0 2px #000; }
#cmOuter { border: 5px solid var(--pc); box-shadow: 0 0 16px var(--pc), 0 0 0 2px #000; }
#catchMarker.near #cmInner { border-color: var(--gold); box-shadow: 0 0 22px var(--gold), 0 0 0 3px #000; }
#catchMarker.hit #cmInner { border-color: var(--gold); transform: translate(-50%, -50%) scale(1.3); transition: transform 150ms; }
#catchMarker.miss #cmInner { border-color: var(--boss); }
.ripple { position: absolute; width: 16px; height: 16px; margin: -8px 0 0 -8px; border-radius: 50%; border: 3px solid var(--rc); animation: ripple 480ms ease-out forwards; }
@keyframes ripple { from { transform: scale(0.5); opacity: 1; } to { transform: scale(4); opacity: 0; } }

/* ---- 部位HUD ---- */
#partsWrap { position: absolute; top: 108px; left: 10px; width: 92px; padding: 5px 6px; background: rgba(20,14,38,.55); border-radius: 6px; }
#partsCount { font-family: var(--display); font-size: 10px; letter-spacing: .06em; color: var(--gold); margin-bottom: 3px; }
.prow { display: grid; grid-template-columns: 44px 1fr; align-items: center; gap: 4px; height: 12px; }
.pl { font-size: 8px; font-weight: 800; color: var(--dim); letter-spacing: .03em; }
.pb { height: 5px; background: #000; border-radius: 3px; overflow: hidden; }
.pb i { display: block; height: 100%; background: #7dffb0; transform-origin: left; transition: transform 250ms; }
.prow[data-state="WARM"] .pb i { background: #ff9ccc; }
.prow[data-state="HEART_MAX"] .pl { color: #ff7ab8; }
.prow.hit { animation: prowhit 400ms; }
@keyframes prowhit { 0% { background: rgba(255,255,255,.35); } 100% { background: transparent; } }
.callout { position: absolute; left: 0; right: 0; top: 46%; text-align: center; font-family: var(--display); font-size: 30px; color: #fff; -webkit-text-stroke: 1.5px #000; text-shadow: 0 3px 0 #000; opacity: 0; pointer-events: none; }
.callout.damaged { color: #ffb13d; font-size: 22px; }
.callout.break { color: var(--gold); text-shadow: 0 3px 0 #000, 0 0 24px var(--boss); }
.callout.all { color: #ff7ad9; font-size: 26px; }
.callout.show { animation: judge 1300ms cubic-bezier(.2,1.6,.4,1) forwards; }

/* ---- ダメージ数字 ---- */
#dmgLayer { position: absolute; inset: 0; }
.dmg { position: absolute; transform: translate(-50%, -50%); font-family: var(--display); font-size: 38px; color: #fff; -webkit-text-stroke: 2px #000; text-shadow: 0 3px 0 #000, 0 0 16px var(--dc); animation: dmg 1s ease-out forwards; text-align: center; line-height: 1; }
.dmg small { display: block; font-size: 12px; color: var(--dc); -webkit-text-stroke: 0; letter-spacing: .15em; }
.dmg.crit { font-size: 54px; color: var(--gold); }
@keyframes dmg { 0% { transform: translate(-50%, -50%) scale(2); opacity: 0; } 12% { transform: translate(-50%, -50%) scale(1); opacity: 1; } 100% { transform: translate(-50%, -150%) scale(.9); opacity: 0; } }

#flash { position: absolute; inset: 0; opacity: 0; mix-blend-mode: screen; }
#speedLines { position: absolute; inset: -10%; opacity: 0; transition: opacity 150ms; background: repeating-conic-gradient(from 0deg at 50% 45%, transparent 0 4deg, rgba(255,255,255,.14) 4deg 5deg); -webkit-mask: radial-gradient(circle at 50% 45%, transparent 28%, #000 70%); mask: radial-gradient(circle at 50% 45%, transparent 28%, #000 70%); }
#speedLines.on { opacity: 1; }


#throwType { position:absolute; left:50%; top:68%; transform:translateX(-50%); z-index:6; pointer-events:none; font-family:var(--display); font-size:12px; letter-spacing:.16em; color:#fff; padding:4px 10px; border-radius:999px; background:rgba(20,14,38,.72); border:1px solid rgba(255,255,255,.45); text-shadow:0 1px 2px #000; }
#throwType[data-type="CURVE"] { border-color:#ff9ccc; }
#throwType[data-type="STRAIGHT"] { border-color:#3ee8ff; }

/* ---- POWER / ENERGY ---- */
#powerGauge { position: absolute; left: 10px; top: 60%; width: 150px; pointer-events: none; display: grid; grid-template-columns: auto 1fr auto; gap: 6px; align-items: center; background: rgba(10,7,20,.75); border: 1px solid #4c3a86; border-radius: 8px; padding: 6px 8px; }
#powerGauge span { font-family: var(--display); font-size: 11px; color: var(--gold); letter-spacing: .08em; }
#powerGauge b { font-family: var(--display); font-weight: 400; font-size: 13px; min-width: 42px; text-align: right; font-variant-numeric: tabular-nums; }
.pgbar { height: 10px; background: #000; border-radius: 5px; overflow: hidden; }
.pgbar i { display: block; height: 100%; transform-origin: left; background: linear-gradient(90deg, #3ee8ff, #ffd23e 70%, #ff3d7f); }
#powerGauge.max { box-shadow: 0 0 0 2px var(--gold), 0 0 18px var(--gold); }
#powerGauge.max b { color: var(--gold); }
#powerGauge.locked span::after { content: " LOCK"; color: #7dffb0; }
#energy { position: absolute; left: calc(8px + env(safe-area-inset-left, 0px)); bottom: calc(12px + env(safe-area-inset-bottom, 0px)); width: 136px; display: grid; grid-template-columns: 1fr auto; grid-template-rows: auto auto; gap: 3px 6px; align-items: center; padding: 5px 7px; border-radius: 8px; border: 1px solid #6b2e55; background: rgba(30,10,26,.75); color: var(--ink); pointer-events: auto; cursor: default; font: inherit; text-align: left; }
#energy .egbar { grid-column: 1 / -1; }
#energy em { font-style: normal; font-family: var(--display); font-size: 9px; color: #ff9ccc; letter-spacing: .06em; white-space: nowrap; }
#energy b { white-space: nowrap; font-size: 9px; font-weight: 800; color: var(--dim); font-variant-numeric: tabular-nums; }
.egbar { height: 8px; background: #000; border-radius: 4px; overflow: hidden; }
.egbar i { display: block; height: 100%; transform-origin: left; transform: scaleX(0); background: linear-gradient(90deg, #ff9ccc, #ff4fa8); transition: transform 200ms; }
#energy.bump .egbar { animation: ebump 300ms; }
@keyframes ebump { 0% { box-shadow: 0 0 0 2px #3ee8ff, 0 0 14px #3ee8ff; } 100% { box-shadow: none; } }
#energy.ready { cursor: pointer; border-color: var(--gold); box-shadow: 0 0 14px rgba(255,210,62,.6); animation: breathe 700ms ease-in-out infinite alternate; }
#energy.ready em { color: var(--gold); }
#energy.ready .egbar i { background: linear-gradient(90deg, #ffd23e, #fff2b0, #ffd23e); }
#energy.armed { background: rgba(80,50,0,.8); }
#energy:focus-visible { outline: 2px solid #fff; }
#game[data-state="TITLE"] #energy { display: none; }
/* ---- プレイヤー ---- */
/* 右下:パーティ4人のキャラクターアイコン(縦・コンパクト)。現在キャラだけ拡大+発光+Pulse+NOW */
#players { position: absolute; right: calc(8px + env(safe-area-inset-right, 0px)); bottom: calc(10px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; align-items: flex-end; gap: 5px; width: 50px; pointer-events: none; }
.pcard { --pc: #fff; --ac: #fff; position: relative; width: 42px; display: grid; justify-items: center; gap: 2px; opacity: .72; filter: saturate(.75) brightness(.85); transform-origin: right center; transition: transform 200ms, opacity 200ms, filter 200ms; }
.picon { position: relative; width: 40px; height: 40px; border-radius: 50%; background-color: #1a1230; background-repeat: no-repeat; box-shadow: 0 0 0 2px #000, 0 0 0 3.5px color-mix(in srgb, var(--pc) 55%, #3a2d66); }
.picon.ph { display: grid; place-items: center; background: radial-gradient(circle at 35% 30%, #fff, var(--ac) 60%, #000); font-family: var(--display); font-size: 16px; color: #fff; -webkit-text-stroke: 1px #000; }
.pslot { position: absolute; left: -5px; bottom: -3px; width: 15px; height: 15px; border-radius: 50%; background: var(--pc); color: #000; font: 400 9px/15px var(--display); text-align: center; font-style: normal; box-shadow: 0 0 0 1.5px #000; }
.pattr { position: absolute; right: -5px; top: -4px; font-size: 11px; font-style: normal; filter: drop-shadow(0 1px 0 #000); }
.pbar { width: 36px; height: 4px; background: #000; border-radius: 2px; overflow: hidden; box-shadow: 0 0 0 1px #000; }
.pbar i { display: block; height: 100%; background: var(--pc); transform-origin: left; transition: transform 250ms; }
.pcard.active { opacity: 1; filter: none; transform: scale(1.22); z-index: 1; }
.pcard.active .picon { box-shadow: 0 0 0 2px #000, 0 0 0 4px var(--pc), 0 0 16px 3px var(--pc); animation: nowpulse 900ms ease-in-out infinite alternate; }
.pcard.active::before { content: "NOW ▶"; position: absolute; right: calc(100% + 5px); top: 13px; font-family: var(--display); font-size: 9px; color: #fff; background: var(--pc); padding: 2px 4px; border-radius: 4px; border: 1.5px solid #000; text-shadow: 0 1px 0 #000; letter-spacing: .04em; white-space: nowrap; }
@keyframes nowpulse { from { box-shadow: 0 0 0 2px #000, 0 0 0 4px var(--pc), 0 0 10px 1px var(--pc); } to { box-shadow: 0 0 0 2px #000, 0 0 0 4px #fff, 0 0 20px 5px var(--pc); } }
.pcard.down { filter: grayscale(1) brightness(.45); }
.pcard.hurt { animation: hurt 400ms; }
@keyframes hurt { 0%, 100% { translate: 0; } 20% { translate: -5px 0; background: #7a1026; } 40% { translate: 5px 0; } 60% { translate: -3px 0; } }

/* ---- タイトル/リザルト ---- */
#title { pointer-events: auto; cursor: pointer; }
.overlay { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; background: radial-gradient(ellipse at 50% 40%, rgba(20,15,36,.35), rgba(10,7,20,.88) 75%); padding-inline: 20px; }
.logo { font-family: var(--display); font-size: 46px; line-height: .95; color: var(--ink); -webkit-text-stroke: 2px #000; text-shadow: 0 5px 0 #000, 0 0 30px var(--boss); }
.logo em { display: block; font-style: normal; color: var(--gold); font-size: 58px; }
.tagline { margin-top: 12px; font-size: 13px; font-weight: 800; color: var(--dim); }
.howto { margin: 22px auto 0; display: grid; gap: 8px; text-align: left; font-size: 13px; max-width: 260px; }
.howto div { display: flex; gap: 10px; align-items: center; background: var(--panel); padding: 8px 10px; border-radius: 6px; border: 1px solid #3a2d66; }
.howto b { font-family: var(--display); font-weight: 400; color: var(--gold); min-width: 64px; }
.bootstatus { margin-top: 10px; font-size: 10px; color: var(--dim); }
.bootstatus[data-bad="1"] { color: #fff; background: #7a1026; padding: 6px 8px; border-radius: 6px; font-size: 12px; }
.keyhint { margin-top: 8px; font-size: 12px; font-weight: 800; color: var(--dim); }
#game[data-state="TITLE"], #game[data-state="GAME_CLEAR"], #game[data-state="GAME_OVER"] { cursor: pointer; }
.tapstart { display: block; margin: 26px auto 0; font-family: var(--display); font-size: 22px; color: #000; background: var(--gold); border: 2px solid #000; border-radius: 10px; padding: 12px 28px; box-shadow: 0 4px 0 #000; cursor: pointer; animation: breathe 700ms ease-in-out infinite alternate; }
.tapstart:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
#resultTitle { font-family: var(--display); font-size: 38px; color: var(--gold); -webkit-text-stroke: 2px #000; text-shadow: 0 4px 0 #000; }
#result[data-clear="0"] #resultTitle { color: var(--boss); }
#resultStats { margin: 18px auto; display: grid; gap: 6px; min-width: 240px; }
#resultStats div { display: flex; justify-content: space-between; gap: 20px; border-bottom: 1px solid #3a2d66; padding-bottom: 4px; font-size: 14px; }
#resultStats b { font-family: var(--display); font-weight: 400; font-variant-numeric: tabular-nums; }
#retry { pointer-events: auto; font-family: var(--display); font-size: 20px; padding: 12px 32px; border-radius: 8px; border: 2px solid #000; background: var(--gold); color: #000; box-shadow: 0 4px 0 #000; cursor: pointer; }
#retry:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }

/* ---- メニュー(STAGE SELECT / PARTY EDIT / CHARACTER SELECT / RESULT) ---- */
.menu { position: absolute; inset: 0; z-index: 10; pointer-events: auto; display: flex; flex-direction: column; background: radial-gradient(ellipse at 50% 30%, rgba(40,18,60,.82), rgba(10,7,20,.96) 75%); padding: calc(10px + env(safe-area-inset-top, 0px)) 12px calc(10px + env(safe-area-inset-bottom, 0px)); }
.mhead { text-align: center; flex: none; }
.mlogo { font-family: var(--display); font-size: 14px; letter-spacing: .08em; color: var(--ink); text-shadow: 0 2px 0 #000; }
.mlogo em { font-style: normal; color: var(--gold); }
.mtitle { font-family: var(--display); font-size: 26px; color: #fff; -webkit-text-stroke: 1.5px #000; text-shadow: 0 3px 0 #000, 0 0 18px #ff5fa2; margin-top: 2px; }
.mstep { font-size: 11px; font-weight: 800; color: var(--dim); margin-top: 2px; }
.mbody { flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; touch-action: pan-y; overscroll-behavior: contain; margin: 8px -4px; padding: 2px 4px; scrollbar-width: thin; }
.mfoot { flex: none; display: flex; gap: 8px; align-items: center; justify-content: center; }
.mfoot .tapstart { margin: 0; font-size: 20px; padding: 11px 22px; }
.mback { font-family: var(--display); font-size: 13px; color: var(--ink); background: #221a3a; border: 2px solid #000; border-radius: 8px; padding: 10px 12px; box-shadow: 0 3px 0 #000; cursor: pointer; }
.mback:focus-visible { outline: 3px solid #fff; outline-offset: 2px; }
.menu .bootstatus { text-align: center; margin-top: 4px; font-size: 9px; }
.menuhint { text-align: center; font-size: 11px; font-weight: 800; color: var(--dim); margin: 8px 0; }
.menu button { font: inherit; color: inherit; }
.attr { color: var(--ac); font-weight: 800; white-space: nowrap; }
/* ステージカード */
.stagelist { display: grid; gap: 10px; }
.stagecard { display: grid; grid-template-columns: 96px 1fr; gap: 10px; text-align: left; padding: 8px; border-radius: 12px; border: 2px solid #3a2d66; background: linear-gradient(135deg, color-mix(in srgb, var(--ac) 22%, #140f24), #140f24 70%); cursor: pointer; transition: transform 120ms, box-shadow 120ms; }
.stagecard:hover, .stagecard.sel { border-color: var(--ac); box-shadow: 0 0 0 1px #000, 0 0 18px color-mix(in srgb, var(--ac) 60%, transparent); }
.stagecard:focus-visible { outline: 3px solid #fff; outline-offset: 2px; }
.stagecard:active { transform: scale(.98); }
.sthumb { height: 132px; border-radius: 8px; background: #000 center 12% / cover no-repeat; box-shadow: inset 0 0 0 1px rgba(255,255,255,.15); }
.sinfo { display: flex; flex-direction: column; gap: 3px; min-width: 0; font-size: 11px; }
.sno { font-family: var(--display); font-size: 13px; color: var(--gold); letter-spacing: .06em; }
.sno em { font-style: normal; margin-left: 6px; font-size: 9px; color: #000; background: #7dffb0; padding: 1px 5px; border-radius: 3px; vertical-align: 2px; }
.sname { font-weight: 800; font-size: 13px; }
.sboss { font-family: var(--display); font-size: 17px; color: #ff9ccc; text-shadow: 0 2px 0 #000; }
.srow { display: flex; gap: 8px; flex-wrap: wrap; color: var(--dim); font-weight: 800; }
.diff { color: #000; background: #9dff7a; padding: 0 5px; border-radius: 3px; }
/* キャラクターカード */
.ccard { --rc: #fff; --ac: #fff; position: relative; display: grid; justify-items: center; gap: 1px; padding: 6px 4px 5px; border-radius: 10px; border: 2px solid var(--rc); background: linear-gradient(180deg, color-mix(in srgb, var(--ac) 30%, #1a1230), #140f24 75%); box-shadow: 0 0 0 1px #000; font-size: 10px; min-width: 0; }
.crank { position: absolute; left: 3px; top: 2px; font-family: var(--display); font-size: 10px; color: var(--rc); text-shadow: 0 1px 0 #000, 0 0 6px var(--rc); }
.cslot { position: absolute; right: 3px; top: 3px; width: 17px; height: 17px; border-radius: 50%; background: var(--gold); color: #000; font-family: var(--display); font-size: 10px; display: grid; place-items: center; box-shadow: 0 0 0 1.5px #000; }
.cbadge { position: absolute; z-index: 2; left: 50%; transform: translateX(-50%); top: 3px; font-size: 9px; font-weight: 800; padding: 0 5px; border-radius: 3px; border: 1px solid #000; white-space: nowrap; }
.cbadge.good { background: #7dffb0; color: #000; }
.cbadge.bad { background: #5a3a6e; color: #ddd; }
.avatar { width: 48px; height: 48px; border-radius: 50%; background-color: #000; background-repeat: no-repeat; box-shadow: 0 0 0 2px #000, 0 0 0 3px var(--ac); position: relative; margin-top: 6px; }
.avatar.ph { background: radial-gradient(circle at 35% 30%, #fff 0, color-mix(in srgb, var(--ac) 70%, #fff) 25%, var(--ac) 60%, color-mix(in srgb, var(--ac) 50%, #000)); display: grid; place-items: center; }
.avatar.ph span { font-family: var(--display); font-size: 22px; color: #fff; -webkit-text-stroke: 1.5px #000; }
.avatar i { position: absolute; font-style: normal; font-size: 14px; right: -4px; bottom: -3px; }
.avatar.ph i { position: absolute; right: -4px; bottom: -3px; font-style: normal; font-size: 14px; }
.cname { font-weight: 800; font-size: 12px; margin-top: 3px; white-space: nowrap; }
.cmeta { display: flex; gap: 4px; align-items: center; font-weight: 800; font-size: 9px; color: var(--ac); }
.cstat { display: flex; gap: 5px; font-size: 9px; font-weight: 800; color: var(--dim); font-variant-numeric: tabular-nums; white-space: nowrap; }
.cstat span:first-child { color: var(--gold); }
.ccard.compact .avatar { width: 38px; height: 38px; }
.ccard.compact .avatar.ph span { font-size: 17px; }
.ccard.compact .cbadge { top: 3px; }
.ccard.compact .cstat { flex-direction: column; gap: 0; align-items: center; }
/* 編成 */
.slots { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.slot, .own, .pick { padding: 0; border: 0; background: none; cursor: pointer; border-radius: 12px; min-width: 0; }
.slot.sel .ccard { box-shadow: 0 0 0 2px #fff, 0 0 16px var(--gold); transform: translateY(-2px); }
.slot:focus-visible, .own:focus-visible, .pick:focus-visible { outline: 3px solid #fff; outline-offset: 2px; }
.owned { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.own.inparty .ccard { filter: brightness(.62); }
.own:hover .ccard, .pick:hover .ccard, .slot:hover .ccard { filter: none; box-shadow: 0 0 0 1px #000, 0 0 12px var(--ac); }
/* 先頭キャラ選択 */
.firstpick { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
.pick { position: relative; }
.pick .ccard { padding: 10px 6px 8px; }
.pick .avatar { width: 64px; height: 64px; }
.pick.sel .ccard { box-shadow: 0 0 0 3px var(--gold), 0 0 22px var(--gold); }
.firsttag { position: absolute; left: 50%; bottom: -8px; transform: translateX(-50%); font-family: var(--display); font-size: 11px; color: #000; background: var(--gold); padding: 1px 8px; border-radius: 4px; border: 1.5px solid #000; }
.vsbox { text-align: center; margin: 14px 0 4px; font-family: var(--display); font-size: 15px; color: #ff9ccc; text-shadow: 0 2px 0 #000; }
.howto.mini { margin-top: 8px; max-width: none; font-size: 11px; gap: 5px; }
.howto.mini div { padding: 5px 8px; }
.howto.mini b { min-width: 52px; font-size: 12px; }
/* リザルト */
.clearlogo { text-align: center; font-family: var(--display); font-size: 34px; color: var(--gold); -webkit-text-stroke: 2px #000; text-shadow: 0 4px 0 #000, 0 0 24px #ff5fa2; animation: judge 1200ms cubic-bezier(.2,1.6,.4,1) forwards; animation-name: popin; }
.clearlogo.over { color: #ff9ccc; }
@keyframes popin { 0% { transform: scale(2); opacity: 0; } 30% { transform: scale(1); opacity: 1; } 100% { transform: scale(1); opacity: 1; } }
.expgain { text-align: center; font-weight: 800; font-size: 13px; color: var(--dim); margin: 2px 0 8px; }
.expgain b { font-family: var(--display); font-size: 22px; color: #7dffb0; }
.exprows { display: grid; gap: 6px; }
.exprow { display: grid; grid-template-columns: 70px 1fr; gap: 8px; align-items: center; background: var(--panel); border: 1px solid #3a2d66; border-radius: 10px; padding: 5px; }
.exprow.leveled { border-color: var(--gold); box-shadow: 0 0 14px rgba(255,210,62,.35); }
.expinfo { min-width: 0; display: grid; gap: 3px; }
.expname { font-weight: 800; font-size: 13px; display: flex; gap: 6px; align-items: baseline; flex-wrap: wrap; }
.expname .lv { font-size: 11px; color: var(--gold); }
.lvup { font-style: normal; font-family: var(--display); font-size: 13px; color: var(--gold); text-shadow: 0 2px 0 #000, 0 0 10px var(--gold); animation: popin 600ms ease-out; }
.expbar { height: 9px; background: #000; border-radius: 5px; overflow: hidden; box-shadow: 0 0 0 1px #3a2d66; }
.expbar i { display: block; height: 100%; transform-origin: left; transform: scaleX(0); background: linear-gradient(90deg, #3ee8ff, #7dffb0); }
.expnum { display: flex; justify-content: space-between; font-size: 10px; font-weight: 800; color: var(--dim); font-variant-numeric: tabular-nums; }
.growth { font-size: 11px; font-weight: 800; color: #7dffb0; }
.rstats { margin: 10px auto 0; display: grid; gap: 3px; max-width: 280px; font-size: 11px; }
.rstats div { display: flex; justify-content: space-between; gap: 16px; border-bottom: 1px solid #3a2d66; padding-bottom: 2px; }
.rstats b { font-family: var(--display); font-weight: 400; font-variant-numeric: tabular-nums; }
#game.menuopen #players, #game.menuopen .bossbar, #game.menuopen #energy, #game[data-state="TITLE"] #players, #game[data-state="TITLE"] .bossbar { visibility: hidden; }

/* ---- SPECIAL カットイン ---- */
#cutin { position: absolute; inset: 0; z-index: 12; pointer-events: none; overflow: hidden; --cc: #ff7ab8; }
#cutin > div { position: absolute; }
.ci-dim { inset: 0; background: #07040f; opacity: 0; }
.ci-band { left: -10%; right: -10%; top: 8%; height: 62%; opacity: 0; transform-origin: 50% 50%;
  background: repeating-linear-gradient(100deg, transparent 0 18px, rgba(255,255,255,.14) 18px 21px), linear-gradient(180deg, color-mix(in srgb, var(--cc) 70%, #fff), var(--cc) 45%, color-mix(in srgb, var(--cc) 55%, #000));
  box-shadow: 0 0 0 3px #000, 0 0 0 6px #fff, 0 0 40px var(--cc); }
.ci-mask { inset: 0; clip-path: polygon(0 11%, 100% 5%, 100% 67%, 0 73%); }
.ci-char { position: absolute; will-change: transform; }
.ci-char img { width: 100%; height: 100%; display: block; filter: drop-shadow(0 0 16px rgba(0,0,0,.6)); }
.ci-text { left: 0; right: 0; top: 72%; text-align: center; line-height: 1; }
.ci-text b { display: block; font-family: var(--display); font-weight: 400; font-size: 34px; color: #fff; -webkit-text-stroke: 2px #000; text-shadow: 0 4px 0 #000, 0 0 20px var(--cc); }
.ci-text span { display: inline-block; margin-top: 6px; font-family: var(--display); font-size: 22px; color: var(--gold); -webkit-text-stroke: 1.5px #000; text-shadow: 0 3px 0 #000, 0 0 16px var(--gold); }
.ci-flash { inset: 0; background: #fff; opacity: 0; }
html.touch .pchint, html.touch .keyhint { display: none; }

/* ---- FEVER TIME ---- */
#feverBar { margin: 3px auto 0; width: 88%; display: grid; grid-template-columns: auto 1fr auto; gap: 5px; align-items: center; }
#feverBar .flabel { font-family: var(--display); font-size: 9px; letter-spacing: .08em; color: #ffcf6e; white-space: nowrap; }
#feverBar .ftrack { position: relative; height: 6px; border-radius: 3px; background: rgba(40,20,10,.85); border: 1px solid #000; overflow: hidden; }
#feverBar .ftrack i { position: absolute; inset: 0; transform-origin: left; transform: scaleX(0); transition: transform 300ms ease-out;
  background: linear-gradient(90deg, #ffb13d, #ffe36e 45%, #ff7ad9); }
#feverBar .fval { font-family: var(--display); font-weight: 400; font-size: 9px; color: #ffe9b0; min-width: 30px; text-align: right; font-variant-numeric: tabular-nums; }
#feverBar .fdots { display: none; }
#feverBar.bump .ftrack { animation: fbump 400ms ease-out; }
@keyframes fbump { 0% { box-shadow: 0 0 0 2px #ffe36e, 0 0 12px #ffb13d; } 100% { box-shadow: none; } }
#feverBar.ready .ftrack { box-shadow: 0 0 10px #ffe36e; }
#feverBar.ready .fval { color: #ffe36e; }
#feverBar.on .flabel { color: #fff; text-shadow: 0 0 8px #ff4fa8, 0 1px 0 #000; font-size: 11px; }
#feverBar.on .ftrack { height: 8px; box-shadow: 0 0 10px #ff4fa8; }
#feverBar.on .ftrack i { background: linear-gradient(90deg, #ff4fa8, #ffd23e, #ff4fa8); background-size: 200% 100%; animation: fshine 1.2s linear infinite; }
#feverBar.on .fval { color: #fff; font-size: 11px; }
@keyframes fshine { to { background-position: -200% 0; } }
#feverFx { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
#feverFx .ff-edge { position: absolute; inset: 0; box-shadow: inset 0 0 28px 6px rgba(255,79,168,.45); border: 2px solid rgba(255,150,210,.35); animation: fedge 1.4s ease-in-out infinite alternate; }
#game.fever-lv2 #feverFx .ff-edge { box-shadow: inset 0 0 36px 9px rgba(255,79,168,.55), inset 0 0 70px 0 rgba(255,210,62,.18); }
#game.fever-lv3 #feverFx .ff-edge { box-shadow: inset 0 0 44px 12px rgba(255,79,168,.62), inset 0 0 90px 0 rgba(255,210,62,.28); border-color: rgba(255,230,140,.55); }
@keyframes fedge { from { opacity: .75; } to { opacity: 1; } }
/* 小さなハートは画面の左右の端だけ(投球軌道・Energy の邪魔をしない) */
#feverFx .ff-h { position: absolute; bottom: -20px; font-style: normal; font-size: 12px; color: #ff9ccc; opacity: 0; text-shadow: 0 0 6px #ff4fa8;
  left: calc(var(--i) * 1% + 2%); animation: fheart 3.2s linear infinite; animation-delay: calc(var(--i) * -0.34s); }
#feverFx .ff-h:nth-child(odd) { left: auto; right: calc(var(--i) * 1% + 2%); }
@keyframes fheart { 0% { transform: translateY(0) scale(.8); opacity: 0; } 15% { opacity: .55; } 100% { transform: translateY(-105vh) scale(1.2); opacity: 0; } }
#game.fever-lv3 #feverFx .ff-h { color: #ffe28a; font-size: 14px; }
#feverFx .ff-pattern { position: absolute; left: 0; right: 0; top: calc(92px + env(safe-area-inset-top, 0px)); text-align: center; font-family: var(--display); font-size: 10px; letter-spacing: .12em; color: #ffe9f4; text-shadow: 0 1px 0 #000, 0 0 8px #ff4fa8; opacity: .85; }
#feverBanner { position: absolute; inset: 0; z-index: 13; pointer-events: none; overflow: hidden; }
#feverBanner .fb-hearts i { position: absolute; left: -14px; top: -14px; font-style: normal; font-size: 28px; color: #ff6fb5; text-shadow: 0 0 10px #ff4fa8, 0 2px 0 #000; will-change: transform; }
#feverBanner .fb-text { position: absolute; left: 0; right: 0; top: 38%; text-align: center; font-family: var(--display); font-size: 38px; line-height: 1.1; color: #ffb3dc; -webkit-text-stroke: 2px #000; text-shadow: 0 4px 0 #000, 0 0 26px #ff4fa8, 0 0 50px #ffd23e; }
#feverBanner[data-kind="outro"] .fb-text { font-size: 30px; color: #ffe9b0; }
#feverBanner .fb-flash { position: absolute; inset: 0; background: #fff; opacity: 0; }
.dmg.fever { color: #fff; text-shadow: 0 3px 0 #000, 0 0 18px #ff4fa8, 0 0 30px #ffd23e; }
.dmg.fever.fl2 { font-size: 46px; }
.dmg.fever.fl3 { font-size: 52px; color: #ffe28a; }
.dmg.fever.crit { font-size: 60px; }
.pcard.fdone::after { content: "✓"; position: absolute; left: -6px; top: -4px; width: 15px; height: 15px; border-radius: 50%; background: #ff4fa8; color: #fff; font: 800 10px/15px var(--body); text-align: center; box-shadow: 0 0 0 1.5px #000; }
#game.fever .pcard.active::before { content: "FEVER ▶"; background: #ff4fa8; }

/* ---- 長押し(CHARACTER DETAIL)---- */
.lphint { margin: -2px auto 8px; width: fit-content; font-size: 11px; font-weight: 800; color: #fff; background: rgba(255,122,184,.18); border: 1px solid rgba(255,122,184,.6); border-radius: 999px; padding: 4px 10px; animation: breathe 900ms ease-in-out infinite alternate; }
.slot, .own, .pick { -webkit-touch-callout: none; }
.slot.lp-hold .ccard, .own.lp-hold .ccard, .pick.lp-hold .ccard { transition: transform 450ms ease-in; transform: scale(.97); }
.slot.lp-fire .ccard, .own.lp-fire .ccard, .pick.lp-fire .ccard { transform: scale(.9) !important; transition: transform 90ms ease-out; box-shadow: 0 0 0 2px #fff, 0 0 18px var(--ac); }
/* ---- CHARACTER DETAIL ---- */
#charDetail { position: absolute; inset: 0; z-index: 16; pointer-events: auto; overflow: hidden; --ac: #ff7ab8; --rc: #fff; touch-action: pan-y; }
#charDetail > * { position: absolute; }
.cd-bg { inset: 0; background: radial-gradient(ellipse at 50% 42%, color-mix(in srgb, var(--ac) 38%, #1a1230) 0%, #120c22 62%, #07040f 100%); }
.cd-fx { inset: 0; pointer-events: none; overflow: hidden; }
.cd-fx i { position: absolute; bottom: -20px; left: calc(var(--i) * 7% + 2%); width: 8px; height: 8px; border-radius: 50%; opacity: 0; animation: cdrise 5s linear infinite; animation-delay: calc(var(--i) * -0.37s); }
#charDetail[data-attr="WATER"] .cd-fx i { background: radial-gradient(circle at 35% 35%, #fff, #7fe0ff 45%, rgba(62,197,255,.2)); box-shadow: 0 0 6px #3ec5ff; width: calc(6px + var(--i) % 3 * 3px); height: calc(6px + var(--i) % 3 * 3px); }
#charDetail[data-attr="FIRE"] .cd-fx i { width: 4px; height: 4px; background: #ffb13d; box-shadow: 0 0 8px 2px #ff6a3d; animation-name: cdember; animation-duration: 3.6s; }
#charDetail[data-attr="THUNDER"] .cd-fx i { bottom: auto; top: calc(var(--i) * 6.5% + 4%); width: 2px; height: 16px; border-radius: 1px; background: #fff6a8; box-shadow: 0 0 8px 2px #ffd23e; animation-name: cdspark; animation-duration: 2.4s; transform: rotate(calc(var(--i) * 37deg)); }
@keyframes cdrise { 0% { transform: translateY(0) scale(.8); opacity: 0; } 15% { opacity: .55; } 100% { transform: translateY(-110vh) scale(1.2); opacity: 0; } }
@keyframes cdember { 0% { transform: translate(0, 0); opacity: 0; } 10% { opacity: .9; } 100% { transform: translate(calc((var(--i) - 7) * 6px), -90vh); opacity: 0; } }
@keyframes cdspark { 0%, 86%, 100% { opacity: 0; } 88% { opacity: .9; } 92% { opacity: .2; } 94% { opacity: .8; } }
/* 全身イラスト:画面高さの約 70% を使う(DetailPosition / DetailScale / DetailRotation) */
.cd-art { left: 0; top: 0; width: 100%; height: 100%; pointer-events: none; }
.cd-art img { position: absolute; height: calc(74% * var(--ds, 1)); width: auto; max-width: none; left: calc(var(--dx, .5) * 100%); top: calc(var(--dy, .52) * 100%);
  transform: translate(-50%, -50%) rotate(var(--dr, 0deg)); -webkit-user-drag: none; user-select: none;
  /* 1枚絵の四角い縁を背景へ溶かす(カードに見せない)*/
  -webkit-mask-image: radial-gradient(ellipse 62% 58% at 50% 50%, #000 62%, transparent 100%); mask-image: radial-gradient(ellipse 62% 58% at 50% 50%, #000 62%, transparent 100%); }
.cd-art.in-r img { animation: cdinR 260ms cubic-bezier(.2,.8,.3,1); }
.cd-art.in-l img { animation: cdinL 260ms cubic-bezier(.2,.8,.3,1); }
@keyframes cdinR { from { opacity: 0; translate: 22% 0; } to { opacity: 1; translate: 0 0; } }
@keyframes cdinL { from { opacity: 0; translate: -22% 0; } to { opacity: 1; translate: 0 0; } }
.cd-scrim { inset: 0; pointer-events: none; background: linear-gradient(180deg, rgba(8,5,16,.75) 0%, rgba(8,5,16,0) 18%, rgba(8,5,16,0) 58%, rgba(8,5,16,.82) 84%, rgba(8,5,16,.95) 100%); }
.cd-head { left: 0; right: 0; top: calc(8px + env(safe-area-inset-top, 0px)); text-align: center; pointer-events: none; }
.cd-title { font-family: var(--display); font-size: 10px; letter-spacing: .18em; color: var(--dim); }
.cd-rank { display: inline-block; margin-top: 2px; font-family: var(--display); font-size: 14px; color: var(--rc); text-shadow: 0 0 10px var(--rc), 0 2px 0 #000; }
.cd-name { font-family: var(--display); font-size: 30px; line-height: 1.05; color: #fff; -webkit-text-stroke: 1.5px #000; text-shadow: 0 3px 0 #000, 0 0 18px var(--ac); }
.cd-meta { font-size: 12px; font-weight: 800; color: #fff; text-shadow: 0 1px 3px #000; }
.cd-attr { color: var(--ac); }
.cd-ph { margin: 4px auto 0; width: fit-content; font-size: 10px; font-weight: 800; color: #000; background: rgba(255,255,255,.75); padding: 1px 6px; border-radius: 4px; }
.cd-nav { top: 46%; width: 40px; height: 40px; border-radius: 50%; border: 2px solid rgba(255,255,255,.6); background: rgba(10,7,20,.45); color: #fff; font-size: 16px; cursor: pointer; }
.cd-nav.prev { left: 8px; } .cd-nav.next { right: 8px; }
.cd-nav:focus-visible, .cd-back:focus-visible { outline: 3px solid #fff; outline-offset: 2px; }
.cd-panel { left: 0; right: 0; bottom: 0; padding: 0 14px calc(10px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 6px; }
.cd-sections { display: grid; gap: 6px; }
.cd-stat { display: flex; justify-content: center; gap: 14px; align-items: baseline; font-size: 12px; font-weight: 800; color: var(--dim); text-shadow: 0 1px 2px #000; }
.cd-stat b { font-family: var(--display); font-weight: 400; font-size: 18px; color: #fff; }
.cd-lv b { color: var(--gold); font-size: 22px; }
.cd-exp { display: grid; grid-template-columns: auto 1fr auto; gap: 8px; align-items: center; font-size: 10px; font-weight: 800; color: var(--dim); }
.cd-exp b { color: #fff; font-variant-numeric: tabular-nums; }
.cd-expbar { height: 8px; background: rgba(0,0,0,.7); border-radius: 4px; overflow: hidden; box-shadow: 0 0 0 1px rgba(255,255,255,.2); }
.cd-expbar i { display: block; height: 100%; transform-origin: left; background: linear-gradient(90deg, #3ee8ff, #7dffb0); }
.cd-traits { display: grid; grid-template-columns: 1fr 1fr; gap: 2px 12px; font-size: 10px; font-weight: 800; }
.cd-traits div { display: flex; justify-content: space-between; gap: 6px; color: #fff; text-shadow: 0 1px 2px #000; }
.cd-traits em { font-style: normal; color: var(--gold); letter-spacing: 1px; }
.cd-desc { margin: 0; font-size: 11.5px; line-height: 1.5; color: #fff; text-shadow: 0 1px 3px #000; text-align: center; }
.cd-back { justify-self: center; font-family: var(--display); font-size: 15px; color: #000; background: var(--gold); border: 2px solid #000; border-radius: 10px; padding: 8px 22px; box-shadow: 0 3px 0 #000; cursor: pointer; }
#charDetail.viewonly .cd-panel, #charDetail.viewonly .cd-head, #charDetail.viewonly .cd-scrim { opacity: 0; transition: opacity 200ms; }
#charDetail.viewonly .cd-panel { pointer-events: none; }
#charDetail .cd-panel, #charDetail .cd-head, #charDetail .cd-scrim { transition: opacity 200ms; }

/* ---- HEART 50% 会話:静けさと緊張感(ボスだけが浮かび上がる)---- */
#focusVig { position: absolute; inset: 0; pointer-events: none; opacity: 0;
  background: radial-gradient(ellipse 58% 48% at 50% 36%, rgba(0,0,0,0) 55%, rgba(4,2,10,.55) 85%, rgba(4,2,10,.8) 100%); }
#game .bossbar, #game #players, #game #energy, #game #feverFx, #game #bossLine { transition: filter 450ms ease, opacity 450ms ease; }
#game.talkmood .bossbar, #game.talkmood #players, #game.talkmood #energy, #game.talkmood #feverFx { filter: brightness(.45) saturate(.6); opacity: .6; }
#game.talkmood #talkBox { background: linear-gradient(180deg, rgba(24,10,26,.86), rgba(10,6,18,.92)); border-color: rgba(255,156,204,.7); box-shadow: 0 0 0 2px #000, 0 0 18px rgba(255,95,162,.25); }
/* ---- 好感度(LOVE)・会話 ---- */
#bossLine { position: absolute; left: 50%; top: calc(96px + env(safe-area-inset-top, 0px)); transform: translateX(-50%); max-width: 84%; padding: 8px 14px; border-radius: 14px; background: rgba(255,255,255,.94); color: #3b1d3f; font-size: 13px; font-weight: 800; line-height: 1.4; box-shadow: 0 4px 0 rgba(0,0,0,.35), 0 0 0 2px #ff9ccc; pointer-events: none; text-align: center; }
#bossLine::after { content: ""; position: absolute; left: 50%; top: -8px; margin-left: -8px; border: 8px solid transparent; border-top: 0; border-bottom-color: rgba(255,255,255,.94); }
#bossLine.show { animation: blpop 2.6s ease-out forwards; }
@keyframes blpop { 0% { opacity: 0; transform: translateX(-50%) scale(.7); } 8% { opacity: 1; transform: translateX(-50%) scale(1.04); } 14% { transform: translateX(-50%) scale(1); } 85% { opacity: 1; } 100% { opacity: 0; } }
#talkBox { position: absolute; left: 12px; right: 12px; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); z-index: 11; padding: 22px 16px 14px; border-radius: 16px; background: linear-gradient(180deg, rgba(40,14,40,.92), rgba(20,10,30,.95)); border: 2px solid #ff9ccc; box-shadow: 0 0 0 2px #000, 0 0 24px rgba(255,95,162,.45); pointer-events: none; }
#talkBox .tb-name { position: absolute; left: 14px; top: -13px; font-family: var(--display); font-size: 13px; color: #fff; background: #ff4fa8; border: 2px solid #000; border-radius: 8px; padding: 2px 10px; }
#talkBox .tb-text { font-size: 17px; font-weight: 800; color: #fff; line-height: 1.5; min-height: 1.5em; text-shadow: 0 1px 2px #000; }
#talkBox.big .tb-text { font-family: var(--display); font-weight: 400; font-size: 24px; color: #ffd0ea; text-align: center; text-shadow: 0 3px 0 #000, 0 0 14px #ff4fa8; }
#talkBox .tb-sub { margin-top: 6px; font-size: 12px; font-weight: 800; color: #ffe9b0; text-align: center; }
#talkBox .tb-sub:empty { display: none; }
#talkBox .tb-next { position: absolute; right: 12px; bottom: 6px; font-size: 11px; color: #ff9ccc; animation: breathe 600ms ease-in-out infinite alternate; }
#talkBox.pop { animation: tbpop 260ms cubic-bezier(.2,1.6,.4,1); }
@keyframes tbpop { from { transform: scale(.85); opacity: 0; } to { transform: none; opacity: 1; } }
#answerHint { position: absolute; left: 0; right: 0; margin: 0 auto; width: fit-content; max-width: 92%; top: calc(92px + env(safe-area-inset-top, 0px)); display: grid; justify-items: center; gap: 2px; padding: 6px 14px; border-radius: 12px; background: rgba(40,10,34,.8); border: 1.5px solid #ff7ab8; box-shadow: 0 0 16px rgba(255,79,168,.45); pointer-events: none; white-space: nowrap; animation: breathe 800ms ease-in-out infinite alternate; }
#answerHint b { font-family: var(--display); font-weight: 400; font-size: 15px; color: #ff9ccc; letter-spacing: .06em; }
#answerHint span { font-size: 11px; font-weight: 800; color: #fff; }
#loveMax { position: absolute; inset: 0; z-index: 12; pointer-events: none; overflow: hidden; }
#loveMax .lm-text { position: absolute; left: 0; right: 0; top: 30%; text-align: center; font-family: var(--display); font-size: 52px; line-height: 1; color: #fff; -webkit-text-stroke: 2px #000; text-shadow: 0 5px 0 #000, 0 0 30px #ff4fa8, 0 0 60px #ffd23e; }
#loveMax .lm-text span { color: #ff5fa2; }
#loveMax.show .lm-text { animation: lmpop 1.1s cubic-bezier(.2,1.6,.4,1) both, lmbeat 900ms 1.1s ease-in-out infinite alternate; }
@keyframes lmpop { 0% { transform: scale(3); opacity: 0; } 40% { transform: scale(1); opacity: 1; } 100% { transform: scale(1); opacity: 1; } }
@keyframes lmbeat { from { transform: scale(1); } to { transform: scale(1.07); } }
#loveMax i { position: absolute; left: calc(var(--i) * 6.2% + 1%); bottom: -30px; font-style: normal; font-size: calc(16px + var(--i) % 4 * 6px); color: #ff7ab8; text-shadow: 0 0 10px #ff4fa8; opacity: 0; }
#loveMax.show i { animation: lmrise 2.6s ease-out infinite; animation-delay: calc(var(--i) * .13s); }
#loveMax i:nth-of-type(3n) { color: #ffe28a; text-shadow: 0 0 10px #ffd23e; }
@keyframes lmrise { 0% { transform: translateY(0) scale(.6); opacity: 0; } 15% { opacity: .95; } 100% { transform: translateY(-95vh) scale(1.3) rotate(20deg); opacity: 0; } }
/* ---- デバッグ ---- */
#debug { position: absolute; top: 80px; right: 10px; display: flex; flex-direction: column; gap: 4px; align-items: flex-end; }
#debug button { pointer-events: auto; font: 800 10px/1 var(--body); color: var(--dim); background: var(--panel); border: 1px solid #3a2d66; border-radius: 4px; padding: 5px 7px; cursor: pointer; }
#debug button[aria-pressed="true"] { color: #000; background: #7dffb0; border-color: #000; }
#debug button:focus-visible { outline: 2px solid #fff; }
#throwInfo { position: absolute; top: 164px; right: 10px; max-width: 46%; text-align: right; font-size: 10px; line-height: 1.5; color: var(--dim); text-shadow: 0 1px 2px #000; font-variant-numeric: tabular-nums; }
#throwInfo b { color: var(--ink); }
#game[data-state="TITLE"] #debug, #game[data-state="TITLE"] #throwInfo, #game[data-state="TITLE"] #partsWrap { display: none; }
/* Debug UI は ShowDebugUI(#game.debug)の時だけ */
#game:not(.debug) #debug, #game:not(.debug) #throwInfo, #game:not(.debug) #partsWrap, #game:not(.debug) #colLabels { display: none !important; }
/* ---- 調整パネル ---- */
.inspector { position: absolute; left: 8px; right: 8px; bottom: 8px; top: 48%; z-index: 20; pointer-events: auto; display: flex; flex-direction: column; background: rgba(14,10,28,.96); border: 1px solid #4c3a86; border-radius: 10px; box-shadow: 0 10px 40px #000; }
.inspector.tall { top: 40px; }
.ihead { padding: 8px 12px; border-bottom: 1px solid #3a2d66; display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
.ihead > div:first-child { display: flex; flex-direction: column; gap: 2px; }
.itabs { display: flex; gap: 4px; }
.itabs button[aria-pressed="true"], .partsel button[aria-pressed="true"] { background: var(--gold); color: #000; border-color: #000; }
.partsel { display: grid; grid-template-columns: repeat(2, 1fr); gap: 4px; margin-bottom: 6px; }
.partsel button { text-align: left; }
.irow.wide { grid-template-columns: 1fr 1fr; }
.filebtn { font: 800 11px/1 var(--body); padding: 9px 10px; border-radius: 6px; border: 1px solid #4c3a86; background: #221a3a; color: var(--ink); cursor: pointer; text-align: center; }
.ihint { font-size: 10px; color: var(--dim); line-height: 1.5; margin: 4px 0 6px; }
/* ---- 当たり判定ラベル ---- */
#colLabels { position: absolute; inset: 0; pointer-events: none; }
.collabel { position: absolute; left: 0; top: 0; }
.collabel::before { content: ""; position: absolute; left: -6px; top: -6px; width: 12px; height: 12px; border-radius: 50%; background: #ff7ab8; box-shadow: 0 0 0 3px rgba(255,255,255,.8), 0 0 10px #ff7ab8; }
.collabel b, .collabel span { position: absolute; left: 12px; white-space: nowrap; background: rgba(60,20,50,.85); border: 1px solid #ff9ccc; padding: 1px 6px; color: #fff; }
.collabel b { top: -18px; font-size: 11px; border-radius: 4px 4px 0 0; }
.collabel span { top: 1px; font-size: 9px; border-radius: 0 0 4px 4px; }
.collabel.flip b, .collabel.flip span { left: auto; right: 12px; }
.collabel[data-state="WARM"]::before { background: #ffb13d; }
.collabel[data-state="HEART_MAX"]::before { background: #ff4fa8; }
.ihead b { font-family: var(--display); font-weight: 400; font-size: 16px; }
.ihead span { font-size: 10px; color: var(--dim); }
.ibody { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; touch-action: pan-y; overscroll-behavior: contain; padding: 4px 12px 10px; }
.ibody h3 { margin: 12px 0 4px; font-size: 11px; color: var(--gold); letter-spacing: .08em; }
.irow { display: grid; grid-template-columns: 1fr 1.1fr 44px; gap: 8px; align-items: center; min-height: 28px; font-size: 11px; }
.irow input[type="range"] { width: 100%; accent-color: var(--gold); }
.irow input[type="checkbox"] { justify-self: start; width: 20px; height: 20px; accent-color: var(--gold); }
.irow output { font-variant-numeric: tabular-nums; text-align: right; color: var(--ink); }
.inote { padding: 8px 12px; font-size: 11px; color: var(--gold); border-top: 1px solid #3a2d66; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.ifoot { display: flex; gap: 6px; padding: 10px 12px; border-top: 1px solid #3a2d66; }
.inspector button { font: 800 11px/1 var(--body); padding: 9px 10px; border-radius: 6px; border: 1px solid #4c3a86; background: #221a3a; color: var(--ink); cursor: pointer; }
.inspector button.primary { margin-left: auto; background: var(--gold); color: #000; border-color: #000; }
.inspector button:focus-visible { outline: 2px solid #fff; }
@media (prefers-reduced-motion: reduce) { #speedLines { display: none; } }

/* ---- 難易度(DIFFICULTY SELECT / バッジ / Stage Intro)---- */
.dchip { display: inline-block; font-family: var(--display); font-size: 12px; letter-spacing: .06em; padding: 1px 8px; border-radius: 999px; color: #0b0714; background: var(--dc); box-shadow: 0 2px 0 #000; vertical-align: middle; -webkit-text-stroke: 0; text-shadow: none; }
.dchip.intitle { font-size: 13px; transform: translateY(-3px); }
.dchip.big { font-size: 18px; padding: 2px 14px; }
.dchip[data-d="HELL"] { color: #fff; }
.diffbadge { display: inline-block; margin-left: 6px; font-size: 9px; padding: 0 6px; border-radius: 999px; background: var(--dc, #7dffb0); color: #0b0714; letter-spacing: .05em; vertical-align: 2px; text-shadow: none; -webkit-text-stroke: 0; }
#game[data-diff="HELL"] .diffbadge { color: #fff; }
.sclears { display: flex; gap: 4px; margin: 2px 0; }
.sclears span { font-size: 9px; font-weight: 800; padding: 0 5px; border-radius: 6px; border: 1px solid color-mix(in srgb, var(--dc) 50%, transparent); color: color-mix(in srgb, var(--dc) 55%, #666); }
.sclears span.on { background: var(--dc); color: #0b0714; border-color: var(--dc); }
.difflist { display: flex; flex-direction: column; gap: 10px; max-width: 460px; margin: 4px auto 0; }
.diffcard { position: relative; text-align: left; padding: 12px 14px; border-radius: 14px; border: 2px solid color-mix(in srgb, var(--dc) 35%, #2a2140); background: rgba(20,12,34,.8); cursor: pointer; transition: transform 120ms, border-color 120ms, box-shadow 120ms; }
.diffcard.sel { border-color: var(--dc); box-shadow: 0 0 0 1px var(--dc), 0 0 18px color-mix(in srgb, var(--dc) 45%, transparent); transform: scale(1.02); }
.diffcard.locked { opacity: .45; cursor: not-allowed; }
.diffcard .dhead { display: flex; align-items: baseline; gap: 8px; }
.diffcard .dlabel { font-family: var(--display); font-size: 24px; color: var(--dc); -webkit-text-stroke: 1px #000; text-shadow: 0 2px 0 #000; }
.diffcard .dja { font-weight: 800; font-size: 13px; color: #fff; }
.diffcard em { margin-left: auto; font-style: normal; font-size: 10px; font-weight: 800; color: #0b0714; background: var(--dc); padding: 1px 6px; border-radius: 6px; }
.diffcard .ddesc { font-weight: 800; font-size: 13px; color: var(--dc); margin-top: 2px; }
.diffcard .dnote { font-size: 11px; color: var(--dim); margin-top: 2px; }
.diffcard .dstats { display: flex; flex-wrap: wrap; gap: 4px 10px; margin-top: 6px; font-size: 10px; color: var(--dim); }
.diffcard .dstats b { color: #fff; }
.drec { font-size: 10px; color: #cfc4ff; margin-top: 4px; }
.drec.r { text-align: center; margin: 0 0 8px; }
.diffcard[data-id="HELL"] .dlabel::before { content: '⚠ '; font-size: .7em; }
.hellwarn { display: none; text-align: center; margin: 10px auto 0; max-width: 460px; font-size: 11px; font-weight: 800; color: #ffb3bf; padding: 6px 10px; border-radius: 10px; border: 1px solid rgba(255,61,90,.5); background: rgba(255,61,90,.12); }
.menu[data-diff="HELL"] { background: radial-gradient(ellipse at 50% 30%, rgba(90,14,32,.86), rgba(22,5,10,.97) 75%); }
.menu[data-diff="HELL"] .hellwarn { display: block; animation: hellpulse 1.2s ease-in-out infinite; }
.menu[data-diff="HELL"] .diffcard.sel[data-id="HELL"] .dlabel { animation: hellshake 0.35s steps(2) infinite; }
@keyframes hellshake { 0% { transform: translate(0,0); } 25% { transform: translate(1px,-1px); } 50% { transform: translate(-1px,1px); } 75% { transform: translate(1px,1px); } 100% { transform: translate(-1px,0); } }
@keyframes hellpulse { 50% { opacity: .65; } }
.hellconfirm { position: absolute; inset: 0; z-index: 30; display: flex; align-items: center; justify-content: center; background: rgba(8,2,6,.72); }
.hcbox { width: min(86%, 320px); text-align: center; padding: 18px 16px 14px; border-radius: 16px; border: 2px solid #ff3d5a; background: rgba(30,6,14,.96); box-shadow: 0 0 30px rgba(255,61,90,.4); }
.hctitle { font-family: var(--display); font-size: 34px; color: #ff3d5a; -webkit-text-stroke: 1.5px #000; text-shadow: 0 3px 0 #000; animation: hellshake 0.35s steps(2) infinite; }
.hctext { font-weight: 800; font-size: 14px; margin: 6px 0 14px; line-height: 1.6; }
.hcbtns { display: flex; gap: 10px; justify-content: center; }
.hcbtns button { flex: 1; padding: 10px 0; border-radius: 12px; border: 2px solid #5a4a70; background: #1a1128; font-weight: 800; cursor: pointer; }
.hcbtns button.go { border-color: #ff3d5a; background: #ff3d5a; color: #fff; }
.hcbtns button:focus-visible { outline: 3px solid #fff; }
.stageline { text-align: center; font-size: 11px; font-weight: 800; color: var(--dim); margin: 0 0 8px; }
.rhead { text-align: center; font-family: var(--display); font-size: 18px; color: #fff; text-shadow: 0 2px 0 #000; margin-top: 4px; }
.expgain small { margin-left: 6px; font-size: 10px; color: var(--dim); }
.stageintro { position: absolute; left: 0; right: 0; top: 17%; z-index: 9; text-align: center; pointer-events: none; opacity: 0; }
.stageintro.show { animation: stageintro 1.7s ease forwards; }
.stageintro .si-stage { font-family: var(--display); font-size: 22px; color: #fff; -webkit-text-stroke: 1.2px #000; text-shadow: 0 3px 0 #000; }
.stageintro .si-diff { font-family: var(--display); font-size: 40px; color: var(--dc); -webkit-text-stroke: 2px #000; text-shadow: 0 4px 0 #000, 0 0 20px var(--dc); line-height: 1.1; }
.stageintro .si-vs { font-weight: 800; font-size: 15px; color: #ff9ccc; text-shadow: 0 2px 0 #000; }
@keyframes stageintro { 0% { opacity: 0; transform: scale(1.3); } 15% { opacity: 1; transform: scale(1); } 80% { opacity: 1; } 100% { opacity: 0; transform: translateY(-10px); } }

/* =====================================================================
   HEART STRIKE:ゲームの外側(HOME / Navigation / 育成 / ガチャ)
   White × Light Blue × Cyan + Heart Pink。キャラクターが主役。blur / glow / particle は控えめ
   ===================================================================== */
#game {
  --sat: env(safe-area-inset-top, 0px); --sab: env(safe-area-inset-bottom, 0px);
  --sal: env(safe-area-inset-left, 0px); --sar: env(safe-area-inset-right, 0px);
  --navh: 64px;
  --hs-navy: #1d2a52; --hs-muted: #5d6b8c; --hs-cyan: #22c3f5; --hs-sky: #bfe9ff; --hs-pink: #ff5fa2; --hs-pink2: #ff8fc4;
  --hs-glass: rgba(255,255,255,.66); --hs-line: rgba(80,150,200,.22);
}
.bootstatus { display: none; }
.bootstatus[data-bad="1"], #game.debug .bootstatus { display: block; }
.inspector { z-index: 40 !important; }
.layer { position: absolute; inset: 0; z-index: 10; overflow: hidden; }
.app-light { color: var(--hs-navy); background: linear-gradient(180deg, #f6fcff 0%, #dff4ff 46%, #c4ecff 100%); font-family: var(--body); }
.app-light button { font: inherit; color: inherit; -webkit-tap-highlight-color: transparent; }
.ic { width: 24px; height: 24px; fill: currentColor; display: block; }

/* ---- Bottom Navigation(5項目固定)---- */
.bnav { box-sizing: border-box; position: absolute; left: 0; right: 0; bottom: 0; z-index: 12; height: calc(var(--navh) + var(--sab)); display: flex; align-items: flex-start; justify-content: space-around;
  padding: 0 calc(var(--sar) + 6px) 0 calc(var(--sal) + 6px); background: rgba(255,255,255,.94); box-shadow: 0 -1px 0 var(--hs-line), 0 -4px 18px rgba(40,120,180,.10); pointer-events: none; }
.bnav .nv { pointer-events: auto; flex: 1; height: 52px; min-width: 44px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; background: none; border: 0; color: #8a97b5; font-weight: 800; font-size: 10px; position: relative; }
.bnav .nv.on { color: var(--hs-pink); }
.bnav .nv-ic { position: relative; display: grid; place-items: center; }
.bnav .nv-dot { position: absolute; top: -2px; right: -6px; width: 8px; height: 8px; border-radius: 50%; background: var(--hs-pink); box-shadow: 0 0 0 2px #fff; }
.bnav .nv.center { transform: translateY(-14px); height: 72px; }
.bnav .nv.center .nv-ic { width: 56px; height: 56px; border-radius: 50%; background: linear-gradient(135deg, #ff6fae, #29c7f7); box-shadow: 0 6px 16px rgba(41,150,220,.35), inset 0 2px 0 rgba(255,255,255,.4); }
.bnav .nv.center .ic { width: 30px; height: 30px; fill: #fff; }
.bnav .nv.center .nv-l { color: var(--hs-navy); }
.bnav .nv.center.on .nv-l { color: var(--hs-pink); }
.bnav .nv.center.glow .nv-ic { box-shadow: 0 0 0 4px rgba(255,255,255,.9), 0 0 18px 4px rgba(255,111,174,.55); }
.bnav .nv.center.pulse .nv-ic { animation: navpulse 2.4s ease-in-out infinite; }
@keyframes navpulse { 0%, 100% { transform: scale(1); } 12% { transform: scale(1.08); } 24% { transform: scale(1); } }
#game.nav-on .menu { padding-bottom: calc(var(--navh) + var(--sab) + 8px); }
#game.nav-on #appScreen .as-body { padding-bottom: calc(var(--navh) + var(--sab) + 16px); }

/* ---- SHEET(暗幕 + 下から出るパネル。Nav は暗幕の下)---- */
.sheet { position: absolute; inset: 0; z-index: 22; }
.sh-scrim { position: absolute; inset: 0; background: rgba(20,40,80,.38); }
.sh-panel { position: absolute; left: 0; right: 0; bottom: 0; max-height: 84%; display: flex; flex-direction: column; background: #fbfeff; color: var(--hs-navy); border-radius: 22px 22px 0 0; padding: 10px calc(var(--sar) + 16px) calc(var(--sab) + 16px) calc(var(--sal) + 16px); box-shadow: 0 -8px 30px rgba(20,60,120,.18); transition: transform .12s; font-family: var(--body); }
.sh-panel.in { animation: shin .22s ease-out; }
@keyframes shin { from { transform: translateY(40%); opacity: .4; } }
.sh-grip { width: 44px; height: 5px; border-radius: 3px; background: #c9dced; margin: 0 auto 8px; }
.sh-x { position: absolute; top: 6px; right: calc(var(--sar) + 8px); width: 44px; height: 44px; border: 0; background: none; font-size: 26px; color: var(--hs-muted); }
.sh-title { font-family: var(--display); font-size: 18px; text-align: center; margin: 4px 44px 12px; }
.sh-body { min-height: 0; display: flex; flex-direction: column; gap: 12px; }
.sh-scroll { overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; touch-action: pan-y; }
.sh-primary { min-height: 52px; border: 0; border-radius: 26px; background: linear-gradient(135deg, #ff6fae, #ff4f95); color: #fff !important; font-family: var(--display) !important; font-size: 18px !important; box-shadow: 0 6px 14px rgba(255,79,149,.35); }
.sh-primary:disabled { background: #c9d3e3; box-shadow: none; }
.toast { position: absolute; left: 50%; top: calc(var(--sat) + 70px); z-index: 30; transform: translateX(-50%); padding: 8px 16px; border-radius: 20px; background: rgba(29,42,82,.88); color: #fff; font-weight: 800; font-size: 13px; pointer-events: none; }
.toast.in { animation: toastin .2s ease-out; }
@keyframes toastin { from { opacity: 0; transform: translate(-50%, -6px); } }

/* ---- HOME ---- */

.gz-fig img { position: absolute; left: 50%; bottom: 0; height: 100%; max-width: 100%; transform: translateX(-50%); aspect-ratio: 2/3; object-fit: contain; object-position: bottom; }
.gz-halo { position: absolute; inset: 0; }
.gz-fig[data-rarity="SSR"] .gz-halo { background: radial-gradient(circle at 50% 42%, rgba(255,160,215,.45), rgba(140,220,255,.2) 45%, rgba(255,255,255,0) 70%); }
.gz-fig[data-rarity="SR"] .gz-halo { background: radial-gradient(circle at 50% 42%, rgba(255,210,62,.35), rgba(255,255,255,0) 60%); }
.gz-grid { position: absolute; left: calc(var(--sal) + 12px); right: calc(var(--sar) + 12px); top: calc(46% + var(--sat) + 12px); display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
.gz-ic { position: relative; aspect-ratio: 1; min-height: 44px; border-radius: 50%; padding: 0; border: 3px solid #fff; background: #e3eef8; box-shadow: 0 2px 6px rgba(40,120,180,.15); }
.gz-ic[data-rarity="SR"] { border-color: #ffd23e; }
.gz-ic[data-rarity="SSR"] { border-color: transparent; background-image: linear-gradient(#e3eef8, #e3eef8), conic-gradient(#ff5f8f, #ffb347, #ffe66b, #7dffb0, #5fd6ff, #8f8bff, #e07bff, #ff5f8f); background-origin: border-box; background-clip: padding-box, border-box; }
.gz-ic.sel { outline: 3px solid var(--hs-pink); outline-offset: 2px; }
.gz-face { position: absolute; inset: 3px; border-radius: 50%; background-color: #cfe2f2; display: grid; place-items: center; font-family: var(--display); font-size: 18px; color: #fff; }
.gz-nb { position: absolute; left: -6px; top: -6px; font-style: normal; font-size: 9px; font-weight: 800; padding: 1px 5px; border-radius: 6px; background: var(--hs-pink); color: #fff; animation: newpop .8s ease-out 2; }
.gz-bottom { position: absolute; left: calc(var(--sal) + 16px); right: calc(var(--sar) + 16px); bottom: calc(var(--sab) + 14px); display: flex; flex-direction: column; gap: 8px; }
.gz-info { display: flex; align-items: baseline; justify-content: center; gap: 8px; flex-wrap: wrap; }
.gz-info b { font-family: var(--display); font-size: 24px; font-weight: 400; }
.gz-info span { font-size: 12px; font-weight: 800; color: var(--hs-muted); }
.gz-rank { font-family: var(--display); font-size: 18px !important; }
.gz-new { font-style: normal; font-family: var(--display); color: var(--hs-pink); }
.gz-primary { min-height: 54px; border: 0; border-radius: 27px; background: linear-gradient(135deg, #ff6fae, #ff4f95); color: #fff !important; font-family: var(--display) !important; font-size: 18px !important; box-shadow: 0 6px 14px rgba(255,79,149,.35); }
.gz-primary:disabled, .gz-s:disabled { opacity: .45; }
.gz-sec { display: flex; gap: 8px; }
.gz-s { flex: 1; min-height: 44px; border-radius: 22px; border: 1px solid #c9d7e8; background: #fff; font-weight: 800 !important; font-size: 12px !important; color: var(--hs-navy) !important; }
@media (prefers-reduced-motion: reduce) { .hm-char img, .ga-reveal[data-rarity="SSR"].revealed .ga-halo, .gg-finger { animation: none !important; } }
