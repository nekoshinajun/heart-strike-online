.callout.show { animation: judge 1300ms cubic-bezier(.2,1.6,.4,1) forwards; }

/* ---- ダメージ数字 ---- */
#dmgLayer { position: absolute; inset: 0; }
.dmg { position: absolute; transform: translate(-50%, -50%); font-family: var(--display); font-size: 38px; color: #fff; -webkit-text-stroke: 2px #000; text-shadow: 0 3px 0 #000, 0 0 16px var(--dc); animation: dmg 1s ease-out forwards; text-align: center; line-height: 1; }
.dmg small { display: block; font-size: 12px; color: var(--dc); -webkit-text-stroke: 0; letter-spacing: .15em; }
.dmg.crit { font-size: 54px; color: var(--gold); }
/* 着弾の段階(PERFECT / GREAT / GOOD / HIT)。命中の瞬間だけ出る */
.landing { position: absolute; transform: translate(-50%, -50%); display: flex; align-items: baseline; gap: 5px; white-space: nowrap; pointer-events: none; font-family: var(--display); color: var(--lc); -webkit-text-stroke: 1.5px rgba(40,0,30,.85); text-shadow: 0 2px 0 rgba(40,0,30,.8), 0 0 12px var(--lc); animation: landPop 900ms cubic-bezier(.2,1.5,.4,1) forwards; }
.landing b { font-size: 22px; letter-spacing: .06em; }
.landing small { font-size: 15px; -webkit-text-stroke: 1px rgba(40,0,30,.85); }
.landing.perfect b { font-size: 30px; }
.landing.perfect small { font-size: 18px; }
.landing.good b, .landing.hit b { font-size: 18px; }
.landing.hit { -webkit-text-stroke: 1px rgba(40,0,30,.7); text-shadow: 0 2px 0 rgba(40,0,30,.7); }
@keyframes landPop { 0% { transform: translate(-50%, -50%) scale(1.8); opacity: 0; } 14% { transform: translate(-50%, -50%) scale(1); opacity: 1; } 75% { opacity: 1; } 100% { transform: translate(-50%, -30%) scale(.96); opacity: 0; } }
/* PERFECT:中央ラインを一瞬だけ縦の光で射抜く(常時は表示しない)/ GREAT:短い淡い筋 */
.landbeam { position: absolute; width: 0; height: 0; pointer-events: none; }
.landbeam i { position: absolute; left: -2px; top: -26vh; width: 4px; height: 52vh; border-radius: 4px; background: linear-gradient(180deg, transparent, var(--lc) 30%, #fff 50%, var(--lc) 70%, transparent); box-shadow: 0 0 14px var(--lc), 0 0 30px var(--lc); transform-origin: 50% 50%; animation: beamIn 560ms cubic-bezier(.15,.9,.3,1) forwards; mix-blend-mode: screen; }
.landbeam b { position: absolute; left: -34px; top: -34px; width: 68px; height: 68px; border-radius: 50%; border: 3px solid #fff; box-shadow: 0 0 16px var(--lc), inset 0 0 12px var(--lc); animation: beamRing 520ms ease-out forwards; }
.landbeam.great i { left: -1.5px; top: -9vh; width: 3px; height: 18vh; opacity: .7; animation-duration: 420ms; }
@keyframes beamIn { 0% { transform: scaleY(0) scaleX(2.5); opacity: 1; } 35% { transform: scaleY(1) scaleX(1); opacity: 1; } 100% { transform: scaleY(1.05) scaleX(.3); opacity: 0; } }
@keyframes beamRing { 0% { transform: scale(.2); opacity: 1; } 100% { transform: scale(1.6); opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .landbeam i, .landbeam b { animation-duration: 1ms; } }
@keyframes dmg { 0% { transform: translate(-50%, -50%) scale(2); opacity: 0; } 12% { transform: translate(-50%, -50%) scale(1); opacity: 1; } 100% { transform: translate(-50%, -150%) scale(.9); opacity: 0; } }

#flash { position: absolute; inset: 0; opacity: 0; mix-blend-mode: screen; }
#speedLines { position: absolute; inset: -10%; opacity: 0; transition: opacity 150ms; background: repeating-conic-gradient(from 0deg at 50% 45%, transparent 0 4deg, rgba(255,255,255,.14) 4deg 5deg); -webkit-mask: radial-gradient(circle at 50% 45%, transparent 28%, #000 70%); mask: radial-gradient(circle at 50% 45%, transparent 28%, #000 70%); }
#speedLines.on { opacity: 1; }


#throwType { position:absolute; left:50%; top:68%; transform:translateX(-50%); z-index:6; pointer-events:none; font-family:var(--display); font-size:12px; letter-spacing:.22em; color:#fff; padding:4px 10px; border-radius:999px; background:rgba(7,7,10,.78); border:1px solid rgba(255,255,255,.14); box-shadow:0 8px 22px #0005; backdrop-filter:blur(10px); text-shadow:0 1px 2px #000; }
#throwType[data-type="CURVE"] { border-color:#ff9ccc; }
#throwType[data-type="STRAIGHT"] { border-color:#3ee8ff; }

/* ---- POWER / ENERGY ---- */
/* 投球前に仕込んだ球質(ハートの周り)。小さく・投げるまで残る */
/* 円運動のカーブ入力(ハートのまわりの弧)*/
#curveRing { position: absolute; z-index: 6; pointer-events: none; }
#curveRing svg { width: 100%; height: 100%; overflow: visible; }
#curveRing .cr-base { fill: none; stroke: rgba(255,255,255,.35); stroke-width: 2; stroke-dasharray: 3 5; }
#curveRing .cr-arc { fill: none; stroke-width: 6; stroke-linecap: round; filter: drop-shadow(0 0 6px currentColor); }
#curveRing .cr-head { stroke: none; }
#curveRing[data-dir="right"] { color: #3ee8ff; } #curveRing[data-dir="left"] { color: #ff6fb1; } #curveRing[data-dir="straight"] { color: #fff; }
#curveRing .cr-arc { stroke: currentColor; } #curveRing .cr-head { fill: currentColor; }
#curveRing .cr-label { position: absolute; left: 50%; bottom: 100%; transform: translate(-50%, -2px); padding: 1px 8px; border-radius: 9px; background: rgba(7,7,10,.6); color: currentColor; font: 800 10px var(--round); letter-spacing: .06em; white-space: nowrap; }
#curveRing.reset .cr-label { animation: crreset .5s ease-out; }
@keyframes crreset { 0% { transform: translate(-50%, -2px) scale(1.25); background: rgba(255,255,255,.85); color: #5b2b45; } 100% { transform: translate(-50%, -2px) scale(1); } }
#energy { position: absolute; left: calc(8px + env(safe-area-inset-left, 0px)); bottom: calc(12px + env(safe-area-inset-bottom, 0px)); width: 136px; display: grid; grid-template-columns: 1fr auto; grid-template-rows: auto auto; gap: 3px 6px; align-items: center; padding: 8px 9px; border-radius: 13px; border: 1px solid rgba(255,255,255,.1); background: rgba(7,7,10,.78); box-shadow: 0 10px 30px rgba(0,0,0,.28), inset 0 1px rgba(255,255,255,.06); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); color: var(--ink); pointer-events: auto; cursor: default; font: inherit; text-align: left; }
#energy .egbar { grid-column: 1 / -1; }
#energy em { font-style: normal; font-family: var(--display); font-size: 9px; color: #ff9ccc; letter-spacing: .06em; white-space: nowrap; }
#energy b { white-space: nowrap; font-size: 9px; font-weight: 800; color: var(--dim); font-variant-numeric: tabular-nums; }
.egbar { height: 8px; background: #18181d; border-radius: 4px; overflow: hidden; }
.egbar i { display: block; height: 100%; transform-origin: left; transform: scaleX(0); background: linear-gradient(90deg, #8b174d, #ff4f9a); transition: transform 200ms; }
#energy.bump .egbar { animation: ebump 300ms; }
@keyframes ebump { 0% { box-shadow: 0 0 0 2px #3ee8ff, 0 0 14px #3ee8ff; } 100% { box-shadow: none; } }
#energy.ready { cursor: pointer; border-color: var(--gold); box-shadow: 0 0 14px rgba(255,210,62,.6); animation: breathe 700ms ease-in-out infinite alternate; }
#energy.ready em { color: var(--gold); }
#energy.ready .egbar i { background: linear-gradient(90deg, #ffd23e, #fff2b0, #ffd23e); }
#energy.armed { background: rgba(80,50,0,.8); }
#energy:focus-visible { outline: 2px solid #fff; }
#game[data-state="TITLE"] #energy { display: none; }
/* ---- プレイヤー ---- */
/* 右下:パーティ4人のキャラクターアイコン(縦・コンパクト)。現在キャラだけ拡大+発光+Pulse+NOW */
#players { position: absolute; right: calc(8px + env(safe-area-inset-right, 0px)); bottom: calc(10px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; align-items: flex-end; gap: 5px; width: 50px; pointer-events: none; }
.pcard { --pc: #fff; --ac: #fff; position: relative; width: 42px; display: grid; justify-items: center; gap: 2px; opacity: .72; filter: saturate(.75) brightness(.85); transform-origin: right center; transition: transform 200ms, opacity 200ms, filter 200ms; }
.picon { position: relative; width: 40px; height: 40px; border-radius: 50%; background-color: #0c0c10; background-repeat: no-repeat; box-shadow: 0 0 0 1px #000, 0 0 0 2px rgba(255,255,255,.14); }
.picon.ph { display: grid; place-items: center; background: radial-gradient(circle at 35% 30%, #fff, var(--ac) 60%, #000); font-family: var(--display); font-size: 16px; color: #fff; -webkit-text-stroke: 1px #000; }
.pslot { position: absolute; left: -5px; bottom: -3px; width: 15px; height: 15px; border-radius: 50%; background: var(--pc); color: #000; font: 400 9px/15px var(--display); text-align: center; font-style: normal; box-shadow: 0 0 0 1.5px #000; }
.pattr { position: absolute; right: -5px; top: -4px; font-size: 11px; font-style: normal; filter: drop-shadow(0 1px 0 #000); }
.pbar { width: 36px; height: 4px; background: #000; border-radius: 2px; overflow: hidden; box-shadow: 0 0 0 1px #000; }
.pbar i { display: block; height: 100%; background: var(--pc); transform-origin: left; transition: transform 250ms; }
.pcard.mine::after { content: "YOU"; position: absolute; right: -4px; top: -7px; padding: 0 4px; border-radius: 999px; background: #ff4fa8; color: #fff; font: 400 8px/12px var(--display); letter-spacing: .04em; box-shadow: 0 0 0 1.5px #000; }
.pcard.active { opacity: 1; filter: none; transform: scale(1.22); z-index: 1; }
.pcard.active .picon { box-shadow: 0 0 0 2px #050507, 0 0 0 3px var(--pc), 0 0 18px color-mix(in srgb, var(--pc) 55%, transparent); animation: nowpulse 900ms ease-in-out infinite alternate; }
.pcard.active::before { content: "NOW ▶"; position: absolute; right: calc(100% + 5px); top: 13px; font-family: var(--display); font-size: 9px; color: #fff; background: #0b0b0f; padding: 3px 7px; border-radius: 999px; border: 1px solid rgba(255,255,255,.18); box-shadow: 0 6px 18px #0007; text-shadow: 0 1px 0 #000; letter-spacing: .04em; white-space: nowrap; }
@property --sp { syntax: '<number>'; inherits: false; initial-value: 0; }
/* SPECIAL ゲージ(キャラごと):アイコンを囲む細いリング(--sp = 0〜1 が時計回りに溜まる)。100% = 必殺技を使える → リングが光って READY! */
.psp { --sp: 0; position: absolute; inset: -4px; border-radius: 50%; pointer-events: none; background: conic-gradient(#ff5fa8 calc(var(--sp) * 1turn), rgba(255,255,255,.16) 0); -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 3px), #000 calc(100% - 2.5px)); mask: radial-gradient(farthest-side, transparent calc(100% - 3px), #000 calc(100% - 2.5px)); transition: --sp 300ms; }
.pready { display: none; position: absolute; left: 50%; top: -11px; transform: translateX(-50%); padding: 0 3px; border-radius: 4px; background: #ff4fa8; color: #fff; font: 400 7px/10px var(--display); font-style: normal; letter-spacing: .03em; white-space: nowrap; box-shadow: 0 0 0 1px #000, 0 0 8px rgba(255,95,168,.9); z-index: 2; }
.pcard.spready .psp { background: #ff6fb3; filter: drop-shadow(0 0 4px #ff4fa8); animation: spglow 900ms ease-in-out infinite alternate; }
.pcard.spready .picon { box-shadow: 0 0 0 1px #000, 0 0 12px 3px rgba(255,95,168,.75); }
.pcard.spready .pready { display: block; animation: spready 900ms ease-in-out infinite alternate; }
.pcard.spready { opacity: 1; filter: none; }
.pcard.spready.down { filter: grayscale(1) brightness(.45); }
.pcard.mine.spready::after { top: auto; bottom: 14px; }
@keyframes spglow { from { filter: drop-shadow(0 0 2px #ff4fa8); } to { filter: drop-shadow(0 0 7px #ff4fa8) brightness(1.25); } }
@keyframes spready { from { transform: translateX(-50%) scale(1); } to { transform: translateX(-50%) scale(1.12); } }
@keyframes nowpulse { from { box-shadow: 0 0 0 2px #000, 0 0 0 4px var(--pc), 0 0 10px 1px var(--pc); } to { box-shadow: 0 0 0 2px #000, 0 0 0 4px #fff, 0 0 20px 5px var(--pc); } }
.pcard.down { filter: grayscale(1) brightness(.45); }
.pcard.hurt { animation: hurt 400ms; }
/* HP ゲージは滑らかに伸び縮み(回復が見える)*/
.pcard .pbar i { transition: transform .45s cubic-bezier(.2,.8,.3,1); }
.pcard.healed .picon { animation: healGlow .8s ease-out; }
@keyframes healGlow { 0% { box-shadow: 0 0 0 2px #fff, 0 0 18px 6px rgba(255,226,140,.9); } 100% { box-shadow: 0 0 0 0 rgba(255,255,255,0), 0 0 0 0 rgba(255,226,140,0); } }
.pcard .healnum { position: absolute; right: calc(100% + 4px); top: 8px; z-index: 3; font: 400 13px var(--display); color: #fff7d6; text-shadow: 0 0 6px #ffd76a, 0 1px 0 #6b4a00; pointer-events: none; animation: healNum .9s ease-out forwards; }
@keyframes healNum { 0% { opacity: 0; transform: translateY(6px) scale(.8); } 25% { opacity: 1; transform: none; } 100% { opacity: 0; transform: translateY(-12px); } }
/* セラ ANGEL HEART:白い翼・白〜金の光・ALL HEAL(約 1.2 秒)*/
#angelFx { position: absolute; inset: 0; z-index: 40; pointer-events: none; overflow: hidden; }
#angelFx[hidden] { display: none; }
#angelFx .af-light { position: absolute; left: 50%; top: 42%; width: 160vmax; height: 160vmax; transform: translate(-50%, -50%) scale(0); border-radius: 50%; background: radial-gradient(circle, rgba(255,255,255,.95) 0, rgba(255,247,214,.7) 12%, rgba(255,222,140,.35) 26%, rgba(255,240,250,0) 48%); }
#angelFx .af-wing { position: absolute; top: 42%; width: 56vw; max-width: 300px; height: auto; fill: #fffdf7; stroke: rgba(230,190,90,.55); stroke-width: 1.2; filter: drop-shadow(0 0 10px rgba(255,236,170,.9)) drop-shadow(0 0 22px rgba(255,255,255,.8)); opacity: 0; }
#angelFx .af-wing .af-arm { fill: #fff8e6; }
#angelFx .af-wing.l { right: 50%; transform-origin: 100% 20%; transform: translateY(-40%) scaleX(-1) rotate(30deg) scale(.4); }
#angelFx .af-wing.r { left: 50%; transform-origin: 0% 20%; transform: translateY(-40%) rotate(30deg) scale(.4); }
#angelFx .af-text { position: absolute; left: 0; right: 0; top: 30%; text-align: center; opacity: 0; }
#angelFx .af-text small { display: block; font: 400 12px var(--display); letter-spacing: .3em; color: #fff7d6; text-shadow: 0 0 6px #d4a52a; }
#angelFx .af-text b { display: block; font: 400 34px var(--display); color: #fff; -webkit-text-stroke: 1px #d9a53a; text-shadow: 0 0 10px #ffd76a, 0 0 24px #fff1b8, 0 3px 0 rgba(140,90,0,.4); }
#angelFx.on .af-light { animation: afLight 1.25s ease-out forwards; }
#angelFx.on .af-wing.l { animation: afWingL 1.25s cubic-bezier(.2,.9,.3,1) forwards; }
#angelFx.on .af-wing.r { animation: afWingR 1.25s cubic-bezier(.2,.9,.3,1) forwards; }
#angelFx.on .af-text { animation: afText 1.25s ease-out forwards; }
@keyframes afLight { 0% { transform: translate(-50%, -50%) scale(0); opacity: 0; } 25% { opacity: 1; } 60% { transform: translate(-50%, -50%) scale(1); opacity: .8; } 100% { transform: translate(-50%, -50%) scale(1.1); opacity: 0; } }
@keyframes afWingL { 0% { opacity: 0; transform: translateY(-40%) scaleX(-1) rotate(30deg) scale(.4); } 30% { opacity: 1; transform: translateY(-40%) scaleX(-1) rotate(-8deg) scale(1); } 75% { opacity: 1; } 100% { opacity: 0; transform: translateY(-46%) scaleX(-1) rotate(-14deg) scale(1.05); } }
@keyframes afWingR { 0% { opacity: 0; transform: translateY(-40%) rotate(30deg) scale(.4); } 30% { opacity: 1; transform: translateY(-40%) rotate(-8deg) scale(1); } 75% { opacity: 1; } 100% { opacity: 0; transform: translateY(-46%) rotate(-14deg) scale(1.05); } }
@keyframes afText { 0%, 30% { opacity: 0; transform: scale(.8); } 45% { opacity: 1; transform: scale(1.06); } 55% { transform: scale(1); } 85% { opacity: 1; } 100% { opacity: 0; transform: translateY(-8px); } }
.flychip.heal { display: flex; align-items: center; gap: 1px; }
.flychip.heal .feather { display: block; width: 7px; height: 16px; border-radius: 50% 50% 50% 50% / 70% 70% 30% 30%; background: linear-gradient(180deg, #fff, #ffe7a3); box-shadow: 0 0 6px #ffd76a; transform: rotate(-30deg); }
.flychip.heal .hh { font-style: normal; font-size: 12px; color: #fff7d6; text-shadow: 0 0 6px #ffd76a, 0 0 2px #fff; }
@media (prefers-reduced-motion: reduce) { #angelFx.on * { animation-duration: .4s; } }
@keyframes hurt { 0%, 100% { translate: 0; } 20% { translate: -5px 0; background: #7a1026; } 40% { translate: 5px 0; } 60% { translate: -3px 0; } }

#game[data-state="TITLE"], #game[data-state="GAME_CLEAR"], #game[data-state="GAME_OVER"] { cursor: pointer; }
/* 味方のアイコン:長押しでステータス(押している間だけ)*/
#players .pcard { pointer-events: auto; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
#pstat { position: absolute; z-index: 30; width: 172px; padding: 9px 10px 10px; border-radius: 18px; border: 1px solid rgba(255,255,255,.9); background: linear-gradient(160deg, rgba(255,255,255,.92), rgba(255,236,246,.86)); color: var(--hs-ink); font-family: var(--round); box-shadow: 0 10px 28px rgba(140,50,95,.35); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); pointer-events: none; }
#pstat.in { animation: bubin .18s ease-out; }
.pst-head { display: grid; grid-template-columns: 38px 1fr auto; gap: 7px; align-items: center; }
.pst-face { width: 38px; height: 38px; border-radius: 50%; background-color: var(--hs-pink-pale); background-size: cover; box-shadow: 0 0 0 2px #fff, 0 0 0 3.5px var(--ac); }
.pst-name b { display: block; font: 800 15px/1.1 var(--round); }
.pst-name small { display: block; font-size: 8.5px; font-weight: 800; color: color-mix(in srgb, var(--ac) 60%, var(--hs-ink)); white-space: nowrap; }
.pst-name em { font-style: normal; font: 800 11px var(--round); color: var(--hs-pink-deep); }
.pst-rank { padding: 0 4px; border-radius: 5px; background: var(--rc); color: #fff; font-style: normal; }
.pst-slot { align-self: start; display: grid; place-items: center; width: 20px; height: 20px; border-radius: 50%; background: var(--pc); color: #000; font: 400 11px var(--display); font-style: normal; box-shadow: 0 0 0 1.5px #000; }
.pst-owner { margin-top: 4px; font: 800 10px var(--round); color: var(--hs-pink-deep); }
.pst-hp { display: grid; grid-template-columns: auto 1fr auto auto; align-items: center; gap: 4px; margin-top: 6px; font: 800 9px var(--round); color: var(--hs-ink-soft); }
.pst-hp > i { display: block; height: 6px; border-radius: 3px; overflow: hidden; background: #f3e6ec; }
.pst-hp > i > i { display: block; height: 100%; transform-origin: left; background: linear-gradient(90deg, #ff9cc8, #ff4f9a); }
.pst-hp b { font-size: 12px; color: var(--hs-ink); }
.pst-hp.down > i > i { background: #d9cbd6; }
.pst-radar { margin: 2px -4px 0; }
.pst-ab small { font: 800 8px var(--round); letter-spacing: .14em; color: var(--hs-pink-deep); }
.pst-ab div { display: flex; flex-wrap: wrap; gap: 2px; margin-top: 2px; }
.pst-ab span { padding: 0 5px; border-radius: 7px; background: #fff; box-shadow: inset 0 0 0 1px var(--hs-line-soft); font: 800 8px/16px var(--round); white-space: nowrap; }
.pst-ab span.ult { background: linear-gradient(120deg, #fff4fb, #efe7ff); }
.pst-ab span.none { color: var(--hs-ink-soft); }
#game.menuopen #players, #game.menuopen .bossbar, #game.menuopen #energy, #game[data-state="TITLE"] #players, #game[data-state="TITLE"] .bossbar { visibility: hidden; }

/* プレイ中の上部 HUD:背景は透明にして推しを隠さない(名前 → LOVE → 左に RALLY / 右に FEVER)。左下 SPECIAL は文字が切れない幅 */
#game:not(.menuopen) .bossbar { top: calc(0px + env(safe-area-inset-top, 0px)); width: min(88%, 360px); padding: 0 2px 2px; border: 0; border-radius: 0; background: transparent; box-shadow: none; backdrop-filter: none; -webkit-backdrop-filter: none; }
#game:not(.menuopen) .bossbar .name { font-size: 13px; letter-spacing: .10em; line-height: 1; margin: 0 0 2px; text-shadow: 0 2px 8px #000, 0 0 12px rgba(255,79,154,.32); }
#game:not(.menuopen) .heartrow { margin-top: 0; grid-template-columns: auto 1fr auto; gap: 7px; }
#game:not(.menuopen) .heartrow .track { height: 7px; background: rgba(5,5,8,.38); border: 1px solid rgba(255,255,255,.14); box-shadow: 0 1px 6px #0008; }
#game:not(.menuopen) #combo { position: absolute; left: 4px; top: 38px; z-index: 2; width: 74px; margin: 0; line-height: 1; justify-content: flex-start; white-space: nowrap; }
#game:not(.menuopen) #feverBar { position: absolute; left: 82px; right: 2px; top: 39px; z-index: 1; width: auto; margin: 0; }
#game:not(.menuopen) #energy { left: calc(8px + env(safe-area-inset-left, 0px)); right: auto; bottom: calc(12px + env(safe-area-inset-bottom, 0px)); box-sizing: border-box; width: 172px; max-width: calc(100% - 78px - env(safe-area-inset-left, 0px) - env(safe-area-inset-right, 0px)); padding: 5px 7px; overflow: hidden; grid-template-columns: minmax(0, 1fr) auto; }
#game:not(.menuopen) #energy em { overflow: visible; text-overflow: clip; white-space: nowrap; }

/* ---- 3. インゲーム演出 ---- */
/* ---- SPECIAL カットイン ---- */
#cutin { position: absolute; inset: 0; z-index: 12; pointer-events: none; overflow: hidden; --cc: #ff7ab8; }
#cutin > div { position: absolute; }
.ci-dim { inset: 0; background: #07040f; opacity: 0; }
.ci-band { left: -10%; right: -10%; top: 8%; height: 62%; opacity: 0; transform-origin: 50% 50%;
  background: repeating-linear-gradient(100deg, transparent 0 18px, rgba(255,255,255,.14) 18px 21px), linear-gradient(180deg, color-mix(in srgb, var(--cc) 70%, #fff), var(--cc) 45%, color-mix(in srgb, var(--cc) 55%, #000));
  box-shadow: 0 0 0 3px #000, 0 0 0 6px #fff, 0 0 40px var(--cc); }
.ci-mask { inset: 0; clip-path: polygon(0 11%, 100% 5%, 100% 67%, 0 73%); }
.ci-char { position: absolute; will-change: transform; }
.ci-char img { width: 100%; height: 100%; display: block; filter: drop-shadow(0 0 16px rgba(0,0,0,.6)); }
.ci-text { left: 0; right: 0; top: 72%; text-align: center; line-height: 1; }
.ci-text b { display: block; font-family: var(--display); font-weight: 400; font-size: 34px; color: #fff; -webkit-text-stroke: 2px #000; text-shadow: 0 4px 0 #000, 0 0 20px var(--cc); }
.ci-text span { display: inline-block; margin-top: 6px; font-family: var(--display); font-size: 22px; color: var(--gold); -webkit-text-stroke: 1.5px #000; text-shadow: 0 3px 0 #000, 0 0 16px var(--gold); }
.ci-flash { inset: 0; background: #fff; opacity: 0; }

/* ---- FEVER TIME ---- */
#feverBar { margin: 3px auto 0; width: 88%; display: grid; grid-template-columns: auto 1fr auto; gap: 5px; align-items: center; }
#feverBar .flabel { font-family: var(--display); font-size: 9px; letter-spacing: .08em; color: #ffcf6e; white-space: nowrap; }
#feverBar .ftrack { position: relative; height: 6px; border-radius: 3px; background: rgba(40,20,10,.85); border: 1px solid #000; overflow: hidden; }
#feverBar .ftrack i { position: absolute; inset: 0; transform-origin: left; transform: scaleX(0); transition: transform 300ms ease-out;
  background: linear-gradient(90deg, #ffb13d, #ffe36e 45%, #ff7ad9); }
#feverBar .fval { font-family: var(--display); font-weight: 400; font-size: 9px; color: #ffe9b0; min-width: 30px; text-align: right; font-variant-numeric: tabular-nums; }
#feverBar .fdots { display: none; }
/* 目盛り:COMBO の数(--fn = 12)で区切る */
#feverBar .fticks { position: absolute; inset: 0; pointer-events: none; background: repeating-linear-gradient(90deg, transparent 0 calc(100% / var(--fn, 12) - 1px), rgba(0,0,0,.55) calc(100% / var(--fn, 12) - 1px) calc(100% / var(--fn, 12))); }
#feverBar.on .fticks { display: none; }
#feverBar.bump .ftrack { animation: fbump 400ms ease-out; }
@keyframes fbump { 0% { box-shadow: 0 0 0 2px #ffe36e, 0 0 12px #ffb13d; } 100% { box-shadow: none; } }
#feverBar.ready .ftrack { box-shadow: 0 0 10px #ffe36e; }
#feverBar.ready .fval { color: #ffe36e; }
#feverBar.on .flabel { color: #fff; text-shadow: 0 0 8px #ff4fa8, 0 1px 0 #000; font-size: 11px; }
#feverBar.on .ftrack { height: 8px; box-shadow: 0 0 10px #ff4fa8; }
#feverBar.on .ftrack i { background: linear-gradient(90deg, #ff4fa8, #ffd23e, #ff4fa8); background-size: 200% 100%; animation: fshine 1.2s linear infinite; }
#feverBar.on .fval { color: #fff; font-size: 11px; }
@keyframes fshine { to { background-position: -200% 0; } }
#feverFx { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
#feverFx .ff-edge { position: absolute; inset: 0; box-shadow: inset 0 0 28px 6px rgba(255,79,168,.45); border: 2px solid rgba(255,150,210,.35); animation: fedge 1.4s ease-in-out infinite alternate; }
#game.fever-lv2 #feverFx .ff-edge { box-shadow: inset 0 0 36px 9px rgba(255,79,168,.55), inset 0 0 70px 0 rgba(255,210,62,.18); }
#game.fever-lv3 #feverFx .ff-edge { box-shadow: inset 0 0 44px 12px rgba(255,79,168,.62), inset 0 0 90px 0 rgba(255,210,62,.28); border-color: rgba(255,230,140,.55); }
@keyframes fedge { from { opacity: .75; } to { opacity: 1; } }
/* 小さなハートは画面の左右の端だけ(投球軌道・Energy の邪魔をしない) */
#feverFx .ff-h { position: absolute; bottom: -20px; font-style: normal; font-size: 12px; color: #ff9ccc; opacity: 0; text-shadow: 0 0 6px #ff4fa8;
  left: calc(var(--i) * 1% + 2%); animation: fheart 3.2s linear infinite; animation-delay: calc(var(--i) * -0.34s); }
#feverFx .ff-h:nth-child(odd) { left: auto; right: calc(var(--i) * 1% + 2%); }
@keyframes fheart { 0% { transform: translateY(0) scale(.8); opacity: 0; } 15% { opacity: .55; } 100% { transform: translateY(-105vh) scale(1.2); opacity: 0; } }
#game.fever-lv3 #feverFx .ff-h { color: #ffe28a; font-size: 14px; }
#feverFx .ff-pattern { position: absolute; left: 0; right: 0; top: calc(92px + env(safe-area-inset-top, 0px)); text-align: center; font-family: var(--display); font-size: 10px; letter-spacing: .12em; color: #ffe9f4; text-shadow: 0 1px 0 #000, 0 0 8px #ff4fa8; opacity: .85; }
#feverBanner { position: absolute; inset: 0; z-index: 13; pointer-events: none; overflow: hidden; }
#feverBanner .fb-hearts i { position: absolute; left: -14px; top: -14px; font-style: normal; font-size: 28px; color: #ff6fb5; text-shadow: 0 0 10px #ff4fa8, 0 2px 0 #000; will-change: transform; }
#feverBanner .fb-text { position: absolute; left: 0; right: 0; top: 38%; text-align: center; font-family: var(--display); font-size: 38px; line-height: 1.1; color: #ffb3dc; -webkit-text-stroke: 2px #000; text-shadow: 0 4px 0 #000, 0 0 26px #ff4fa8, 0 0 50px #ffd23e; }
#feverBanner[data-kind="outro"] .fb-text { font-size: 30px; color: #ffe9b0; }
#feverBanner .fb-flash { position: absolute; inset: 0; background: #fff; opacity: 0; }
.dmg.fever { color: #fff; text-shadow: 0 3px 0 #000, 0 0 18px #ff4fa8, 0 0 30px #ffd23e; }
.dmg.fever.fl2 { font-size: 46px; }
.dmg.fever.fl3 { font-size: 52px; color: #ffe28a; }
.dmg.fever.crit { font-size: 60px; }
.pcard.fdone::after { content: "✓"; position: absolute; left: -6px; top: -4px; width: 15px; height: 15px; border-radius: 50%; background: #ff4fa8; color: #fff; font: 800 10px/15px var(--body); text-align: center; box-shadow: 0 0 0 1.5px #000; }
#game.fever .pcard.active::before { content: "FEVER ▶"; background: #ff4fa8; }

/* ---- 好感度(LOVE)・会話 ---- */
#bossLine { position: absolute; left: 50%; top: calc(96px + env(safe-area-inset-top, 0px)); transform: translateX(-50%); max-width: 84%; padding: 8px 14px; border-radius: 14px; background: rgba(255,255,255,.94); color: #3b1d3f; font-size: 13px; font-weight: 800; line-height: 1.4; box-shadow: 0 4px 0 rgba(0,0,0,.35), 0 0 0 2px #ff9ccc; pointer-events: none; text-align: center; }
#bossLine::after { content: ""; position: absolute; left: 50%; top: -8px; margin-left: -8px; border: 8px solid transparent; border-top: 0; border-bottom-color: rgba(255,255,255,.94); }
#bossLine.show { animation: blpop 2.6s ease-out forwards; }
@keyframes blpop { 0% { opacity: 0; transform: translateX(-50%) scale(.7); } 8% { opacity: 1; transform: translateX(-50%) scale(1.04); } 14% { transform: translateX(-50%) scale(1); } 85% { opacity: 1; } 100% { opacity: 0; } }
#talkBox { position: absolute; left: 12px; right: 12px; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); z-index: 11; padding: 22px 16px 14px; border-radius: 16px; background: linear-gradient(180deg, rgba(40,14,40,.92), rgba(20,10,30,.95)); border: 2px solid #ff9ccc; box-shadow: 0 0 0 2px #000, 0 0 24px rgba(255,95,162,.45); pointer-events: none; }
#talkBox .tb-name { position: absolute; left: 14px; top: -13px; font-family: var(--display); font-size: 13px; color: #fff; background: #ff4fa8; border: 2px solid #000; border-radius: 8px; padding: 2px 10px; }
#talkBox .tb-text { font-size: 17px; font-weight: 800; color: #fff; line-height: 1.5; min-height: 1.5em; text-shadow: 0 1px 2px #000; }
#talkBox.big .tb-text { font-family: var(--display); font-weight: 400; font-size: 24px; color: #ffd0ea; text-align: center; text-shadow: 0 3px 0 #000, 0 0 14px #ff4fa8; }
#talkBox .tb-sub { margin-top: 6px; font-size: 12px; font-weight: 800; color: #ffe9b0; text-align: center; }
#talkBox .tb-sub:empty { display: none; }
#talkBox .tb-next { position: absolute; right: 12px; bottom: 6px; font-size: 11px; color: #ff9ccc; animation: breathe 600ms ease-in-out infinite alternate; }
#talkBox.pop { animation: tbpop 260ms cubic-bezier(.2,1.6,.4,1); }
@keyframes tbpop { from { transform: scale(.85); opacity: 0; } to { transform: none; opacity: 1; } }
#loveMax { position: absolute; inset: 0; z-index: 12; pointer-events: none; overflow: hidden; }
#loveMax .lm-text { position: absolute; left: 0; right: 0; top: 30%; text-align: center; font-family: var(--display); font-size: 52px; line-height: 1; color: #fff; -webkit-text-stroke: 2px #000; text-shadow: 0 5px 0 #000, 0 0 30px #ff4fa8, 0 0 60px #ffd23e; }
#loveMax .lm-text span { color: #ff5fa2; }
#loveMax.show .lm-text { animation: lmpop 1.1s cubic-bezier(.2,1.6,.4,1) both, lmbeat 900ms 1.1s ease-in-out infinite alternate; }
@keyframes lmpop { 0% { transform: scale(3); opacity: 0; } 40% { transform: scale(1); opacity: 1; } 100% { transform: scale(1); opacity: 1; } }
@keyframes lmbeat { from { transform: scale(1); } to { transform: scale(1.07); } }
#loveMax i { position: absolute; left: calc(var(--i) * 6.2% + 1%); bottom: -30px; font-style: normal; font-size: calc(16px + var(--i) % 4 * 6px); color: #ff7ab8; text-shadow: 0 0 10px #ff4fa8; opacity: 0; }
#loveMax.show i { animation: lmrise 2.6s ease-out infinite; animation-delay: calc(var(--i) * .13s); }
#loveMax i:nth-of-type(3n) { color: #ffe28a; text-shadow: 0 0 10px #ffd23e; }
@keyframes lmrise { 0% { transform: translateY(0) scale(.6); opacity: 0; } 15% { opacity: .95; } 100% { transform: translateY(-95vh) scale(1.3) rotate(20deg); opacity: 0; } }

/* ステージ開始の案内 / 難易度バッジ(インゲームとメニュー共通)*/
.dchip { display: inline-block; font-family: var(--display); font-size: 12px; letter-spacing: .06em; padding: 1px 8px; border-radius: 999px; color: #0b0714; background: var(--dc); box-shadow: 0 2px 0 #000; vertical-align: middle; -webkit-text-stroke: 0; text-shadow: none; }
.dchip.intitle { font-size: 13px; transform: translateY(-3px); }
.dchip.big { font-size: 18px; padding: 2px 14px; }
.dchip[data-d="HELL"] { color: #fff; }
.diffbadge { display: inline-block; margin-left: 6px; font-size: 9px; padding: 0 6px; border-radius: 999px; background: var(--dc, #7dffb0); color: #0b0714; letter-spacing: .05em; vertical-align: 2px; text-shadow: none; -webkit-text-stroke: 0; }
#game[data-diff="HELL"] .diffbadge { color: #fff; }

/* ---- 4. 開発用(Debug UI は ShowDebugUI = #game.debug の時だけ)---- */
/* ---- デバッグ ---- */
#debug { position: absolute; top: 80px; right: 10px; display: flex; flex-direction: column; gap: 4px; align-items: flex-end; }
#debug button { pointer-events: auto; font: 800 10px/1 var(--body); color: var(--dim); background: var(--panel); border: 1px solid #3a2d66; border-radius: 4px; padding: 5px 7px; cursor: pointer; }
#debug button[aria-pressed="true"] { color: #000; background: #7dffb0; border-color: #000; }
#debug button:focus-visible { outline: 2px solid #fff; }
/* バトル開始演出(OPENING):インゲームの上にボス紹介。BGM はもう流れている */
#opening { position: absolute; inset: 0; z-index: 9; pointer-events: none; }
#opening .op-dim { position: absolute; inset: 0; background: radial-gradient(ellipse 70% 55% at 50% 40%, rgba(10,4,16,0) 0%, rgba(10,4,16,calc(var(--op-dim) * .6)) 60%, rgba(10,4,16,var(--op-dim)) 100%); opacity: 0; transition: opacity .35s ease; }
#opening.dim .op-dim { opacity: 1; }
#opening .op-card { position: absolute; left: 0; right: 0; bottom: 21%; text-align: center; padding: 0 18px; }
#opening .op-target, #opening .op-name, #opening .op-diff, #opening .op-profile, #opening .op-line { display: block; opacity: 0; transform: translateY(10px); transition: opacity .3s ease, transform .3s cubic-bezier(.2,1.4,.4,1); }
#opening .op-target { font-family: var(--display); font-size: 13px; letter-spacing: .5em; color: #ffb3dc; text-shadow: 0 0 10px #ff5fa2, 0 1px 2px #000; }
#opening .op-name { font-size: 40px; font-weight: 900; color: #fff; line-height: 1.1; text-shadow: 0 0 18px rgba(255,95,162,.8), 0 3px 0 #b8326e, 0 4px 10px #000; }
#opening .op-diff { display: inline-block; margin-top: 6px; padding: 2px 14px; border-radius: 999px; font-family: var(--display); font-size: 18px; letter-spacing: .14em; color: #fff; background: var(--dc); box-shadow: 0 0 14px var(--dc); text-shadow: 0 1px 2px #0006; }
#opening .op-profile { margin: 10px auto 0; max-width: 340px; font-size: 13px; font-weight: 700; line-height: 1.6; color: #fff; text-shadow: 0 1px 3px #000; }
#opening .op-line { margin: 8px auto 0; max-width: 340px; font-size: 15px; font-weight: 800; color: #ffe2f1; text-shadow: 0 0 8px #ff5fa2, 0 1px 3px #000; }
#opening.name .op-target, #opening.name .op-name, #opening.diff .op-diff, #opening.text .op-profile, #opening.text .op-line { opacity: 1; transform: none; }
#opening.out .op-card, #opening.out .op-dim { opacity: 0; transition: opacity .35s ease; }   /* .dim より後に書く(同じ詳細度で上書き)*/
#throwInfo { position: absolute; top: 164px; right: 10px; max-width: 46%; text-align: right; font-size: 10px; line-height: 1.5; color: var(--dim); text-shadow: 0 1px 2px #000; font-variant-numeric: tabular-nums; }
#throwInfo b { color: var(--ink); }
#game[data-state="TITLE"] #debug, #game[data-state="TITLE"] #throwInfo, #game[data-state="TITLE"] #partsWrap { display: none; }
/* Debug UI は ShowDebugUI(#game.debug)の時だけ */
#game:not(.debug) #debug, #game:not(.debug) #throwInfo, #game:not(.debug) #partsWrap, #game:not(.debug) #colLabels { display: none !important; }
/* ---- 調整パネル ---- */
.inspector { position: absolute; left: 8px; right: 8px; bottom: 8px; top: 48%; z-index: 40; pointer-events: auto; display: flex; flex-direction: column; background: rgba(14,10,28,.96); border: 1px solid #4c3a86; border-radius: 10px; box-shadow: 0 10px 40px #000; }
.inspector.tall { top: 40px; }
.ihead { padding: 8px 12px; border-bottom: 1px solid #3a2d66; display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
.ihead > div:first-child { display: flex; flex-direction: column; gap: 2px; }
.itabs { display: flex; gap: 4px; }
.itabs button[aria-pressed="true"], .partsel button[aria-pressed="true"] { background: var(--gold); color: #000; border-color: #000; }
.partsel { display: grid; grid-template-columns: repeat(2, 1fr); gap: 4px; margin-bottom: 6px; }
.partsel button { text-align: left; }
.irow.wide { grid-template-columns: 1fr 1fr; }
.filebtn { font: 800 11px/1 var(--body); padding: 9px 10px; border-radius: 6px; border: 1px solid #4c3a86; background: #221a3a; color: var(--ink); cursor: pointer; text-align: center; }
.ihint { font-size: 10px; color: var(--dim); line-height: 1.5; margin: 4px 0 6px; }
/* ---- 当たり判定ラベル ---- */
#colLabels { position: absolute; inset: 0; pointer-events: none; }
.collabel { position: absolute; left: 0; top: 0; }
.collabel::before { content: ""; position: absolute; left: -6px; top: -6px; width: 12px; height: 12px; border-radius: 50%; background: #ff7ab8; box-shadow: 0 0 0 3px rgba(255,255,255,.8), 0 0 10px #ff7ab8; }
.collabel b, .collabel span { position: absolute; left: 12px; white-space: nowrap; background: rgba(60,20,50,.85); border: 1px solid #ff9ccc; padding: 1px 6px; color: #fff; }
.collabel b { top: -18px; font-size: 11px; border-radius: 4px 4px 0 0; }
.collabel span { top: 1px; font-size: 9px; border-radius: 0 0 4px 4px; }
.collabel.flip b, .collabel.flip span { left: auto; right: 12px; }
.collabel[data-state="WARM"]::before { background: #ffb13d; }
.collabel[data-state="HEART_MAX"]::before { background: #ff4fa8; }
.ihead b { font-family: var(--display); font-weight: 400; font-size: 16px; }
.ihead span { font-size: 10px; color: var(--dim); }
.ibody { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; touch-action: pan-y; overscroll-behavior: contain; padding: 4px 12px 10px; }
.ibody h3 { margin: 12px 0 4px; font-size: 11px; color: var(--gold); letter-spacing: .08em; }
.irow { display: grid; grid-template-columns: 1fr 1.1fr 44px; gap: 8px; align-items: center; min-height: 28px; font-size: 11px; }
.irow input[type="range"] { width: 100%; accent-color: var(--gold); }
.irow input[type="checkbox"] { justify-self: start; width: 20px; height: 20px; accent-color: var(--gold); }
.irow output { font-variant-numeric: tabular-nums; text-align: right; color: var(--ink); }
.inote { padding: 8px 12px; font-size: 11px; color: var(--gold); border-top: 1px solid #3a2d66; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.ifoot { display: flex; gap: 6px; padding: 10px 12px; border-top: 1px solid #3a2d66; }
.inspector button { font: 800 11px/1 var(--body); padding: 9px 10px; border-radius: 6px; border: 1px solid #4c3a86; background: #221a3a; color: var(--ink); cursor: pointer; }
.inspector button.primary { margin-left: auto; background: var(--gold); color: #000; border-color: #000; }
.inspector button:focus-visible { outline: 2px solid #fff; }
@media (prefers-reduced-motion: reduce) { #speedLines { display: none; } }

/* =====================================================================
   5. アプリ共通(ゲームの外側)
   方針:女の子が主役。UI は明るいパステル(ピンク / 白 / クリーム / ラベンダー)で、
   キャラクターより目立たせない。文字はワインブラウン、アクセントだけピンクゴールド。
   ===================================================================== */
.bootstatus { display: none; margin-top: 10px; font-size: 10px; color: var(--dim); }
.bootstatus[data-bad="1"], #game.debug .bootstatus { display: block; }
.bootstatus[data-bad="1"] { color: #fff; background: #7a1026; padding: 6px 8px; border-radius: 6px; font-size: 12px; }
.layer { position: absolute; inset: 0; z-index: 10; overflow: hidden; }
.app-light { color: var(--hs-ink); background: var(--hs-bg); font-family: var(--round); color-scheme: light; }
:where(.app-light) button { font: inherit; color: inherit; -webkit-tap-highlight-color: transparent; }   /* :where = 詳細度 0。個別のボタン指定が必ず勝つ */
.ic { width: 24px; height: 24px; fill: currentColor; display: block; }
/* HOME / ガチャ / メニュー等の不透明な画面の間は、下のインゲーム UI と 3D を描かない(隠れたアニメーションの再描画を止める)*/
#game.app-opaque > #view { visibility: hidden; }
#game.app-opaque #ui > :not(#menu):not(#inspector):not(#debug) { display: none; }

/* ---- 下部ナビ(5項目固定)。二重の細枠 + 上部中央の飾り + 専用アイコン。選択中はピンクに発光 ---- */
.bnav {
  box-sizing: border-box; position: absolute; left: 7px; right: 7px; bottom: 0; z-index: 18;   /* キャラ詳細(16)より上・SHEET(22)より下 */
  height: calc(var(--navh) + var(--sab)); display: flex; align-items: flex-start; justify-content: space-around;
  padding: 5px calc(var(--sar) + 4px) var(--sab) calc(var(--sal) + 4px); overflow: visible; pointer-events: none;
  border: 1px solid var(--hs-line); border-bottom: 0; border-radius: 22px 22px 0 0;
  background: linear-gradient(180deg, rgba(255,255,255,.97), rgba(255,241,248,.97) 55%, rgba(248,238,255,.98));
  box-shadow: 0 -8px 26px rgba(205,84,140,.16), inset 0 0 0 3px rgba(255,255,255,.75), inset 0 1px #fff;
  backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
}
.bnav::before { content: ""; position: absolute; left: 11px; right: 11px; top: 3px; height: 3px; background: linear-gradient(90deg, transparent, rgba(231,168,181,.25) 12%, rgba(231,168,181,.8) 50%, rgba(231,168,181,.25) 88%, transparent); }
.bnav::after { content: "✦ · ♡ · ✦"; position: absolute; left: 50%; top: -10px; transform: translateX(-50%); padding: 0 6px; color: var(--hs-pink); font: 800 10px/1.6 var(--round); letter-spacing: 3px; white-space: nowrap; text-shadow: 0 0 8px rgba(255,120,180,.55), 0 1px 0 #fff; }
.bnav .nv { pointer-events: auto; position: relative; flex: 1; height: 68px; min-width: 44px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; background: none; border: 0; color: #b98aa2; font: 800 10px var(--round); }
.bnav .nv-ic { position: relative; width: 37px; height: 37px; display: grid; place-items: center; }
.bnav .nv .ic { width: 29px; height: 29px; fill: none; stroke: currentColor; stroke-width: 1.65; stroke-linecap: round; stroke-linejoin: round; }
.bnav .nv-l { font-size: 10px; letter-spacing: .02em; }
.bnav .nv-dot { position: absolute; top: -2px; right: -6px; width: 8px; height: 8px; border-radius: 50%; background: var(--hs-pink); box-shadow: 0 0 0 2px #fff; }
.bnav .nv.on { color: var(--hs-pink-deep); }
.bnav .nv.on .nv-ic { filter: drop-shadow(0 0 6px rgba(255,95,162,.45)); }
.bnav .nv.center { color: #c27a9c; }
.bnav .nv.center .nv-ic { width: 43px; height: 40px; }
.bnav .nv.center .ic { width: 37px; height: 37px; }
.bnav .nv.center.on { color: var(--hs-pink); }
.bnav .nv.center.on::before { content: ""; position: absolute; left: 50%; top: -7px; width: 62px; height: 62px; transform: translateX(-50%); border-radius: 50%; background: radial-gradient(circle, rgba(255,95,162,.26), rgba(255,95,162,.07) 48%, transparent 70%); filter: blur(2px); pointer-events: none; }
.bnav .nv.center.on .ic, .bnav .nv.center.glow .ic { filter: drop-shadow(0 0 5px rgba(255,95,162,.85)) drop-shadow(0 0 12px rgba(255,95,162,.45)); }
.bnav .nv.center.pulse .nv-ic { animation: navpulse 2.4s ease-in-out infinite; }
@keyframes navpulse { 0%, 100% { transform: scale(1); } 12% { transform: scale(1.08); } 24% { transform: scale(1); } }
#game.nav-on .menu { padding-bottom: calc(var(--navh) + var(--sab) + 8px); }
/* 下部メニューはインゲーム以外の全画面で固定表示:どの画面も最後の要素がメニューの裏に隠れないよう下に余白を取る */
#game.nav-on #gachaLayer > .ga-result { padding-bottom: calc(var(--navh) + var(--sab) + 14px); }
#game.nav-on .cd-panel { padding-bottom: calc(var(--navh) + var(--sab) + 10px); }
#game.nav-on #appScreen .as-body { padding-bottom: calc(var(--navh) + var(--sab) + 16px); }

/* ---- シート(暗幕 + 下から出るパネル。ナビは暗幕の下)---- */
.sheet { position: absolute; inset: 0; z-index: 22; }
.sh-scrim { position: absolute; inset: 0; background: rgba(91,43,69,.38); }
.sh-panel { position: absolute; left: 0; right: 0; bottom: 0; max-height: 84%; display: flex; flex-direction: column; padding: 10px calc(var(--sar) + 16px) calc(var(--sab) + 16px) calc(var(--sal) + 16px); border-radius: 24px 24px 0 0; border-top: 1px solid var(--hs-line); background: linear-gradient(180deg, #fff 0%, #fff4f9 100%); color: var(--hs-ink); font-family: var(--round); color-scheme: light; box-shadow: 0 -12px 36px rgba(140,50,95,.22); transition: transform .12s; }
.sh-panel.in { animation: shin .22s ease-out; }
@keyframes shin { from { transform: translateY(40%); opacity: .4; } }
.sh-grip { width: 44px; height: 5px; border-radius: 3px; background: var(--hs-pink-soft); margin: 0 auto 8px; }
.sh-x { position: absolute; top: 6px; right: calc(var(--sar) + 8px); width: 44px; height: 44px; border: 0; background: none; font-size: 26px; color: var(--hs-ink-soft); }
.sh-title { font: 800 18px var(--round); text-align: center; margin: 4px 44px 12px; color: var(--hs-ink); }
.sh-body { min-height: 0; display: flex; flex-direction: column; gap: 12px; }
.sh-scroll { overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; touch-action: pan-y; }
.sh-primary { min-height: 52px; border: 1px solid rgba(255,255,255,.7); border-radius: 26px; background: var(--hs-cta); color: #fff; font: 800 18px var(--round); box-shadow: 0 8px 20px rgba(255,79,154,.32), inset 0 1px rgba(255,255,255,.4); }
.sh-primary:disabled { background: #e6d6df; box-shadow: none; }
.toast { position: absolute; left: 50%; top: calc(var(--sat) + 70px); z-index: 30; transform: translateX(-50%); padding: 8px 16px; border-radius: 20px; border: 1px solid var(--hs-line); background: rgba(255,255,255,.95); color: var(--hs-ink); font: 800 13px var(--round); box-shadow: var(--hs-shadow); pointer-events: none; }
.toast.in { animation: toastin .2s ease-out; }
@keyframes toastin { from { opacity: 0; transform: translate(-50%, -6px); } }
/* 役割タグ・クリア状況・ASMR 状態(仲間 / 攻略対象の見分け)*/
.role { display: inline-flex; align-items: center; gap: 2px; padding: 1px 8px; border-radius: 999px; font: 800 11px/1.6 var(--round); white-space: nowrap; vertical-align: middle; letter-spacing: 0; text-transform: none; }
.role.ally { background: var(--ally-soft); color: #d63a80; box-shadow: inset 0 0 0 1px rgba(255,95,162,.35); }
.role.heroine { background: var(--heroine-soft); color: #6a4fd6; box-shadow: inset 0 0 0 1px rgba(139,108,240,.35); }
.role.sm { padding: 0 6px; font-size: 9px; }
.clr-chips { display: inline-flex; flex-wrap: wrap; gap: 4px; }
.clr-chips i { font-style: normal; padding: 1px 6px; border-radius: 6px; font: 800 9px/1.5 var(--round); color: color-mix(in srgb, var(--dc) 55%, #9b8f99); background: #fff; box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--dc) 40%, #fff); }
.clr-chips i.on { color: #fff; background: var(--dc); box-shadow: none; }
.asmr-st { display: block; font-size: 10px; font-weight: 800; color: #6a4fd6; }
.asmr-st.soon, .asmr-st.lock { color: #8f84a8; }
.asmr-st b { color: #fff; background: var(--hs-pink); padding: 0 4px; border-radius: 4px; font-size: 9px; }

/* =====================================================================
   6. HOME:お気に入りの女の子に会う場所(キャラを中央〜下に大きく)
   右上:HEART GEM / その下にミッション・プレゼント・設定を縦に。下:TODAY'S PICK(ナビと重ねない)
   ===================================================================== */
#home .hm-bg { position: absolute; inset: 0; background:
  radial-gradient(ellipse 72% 40% at 50% 42%, rgba(255,255,255,.95), rgba(255,255,255,0) 72%),
  radial-gradient(ellipse 70% 26% at 50% 90%, rgba(255,150,200,.38), transparent 70%),
  linear-gradient(180deg, #fff3f9 0%, #ffe3f0 55%, #efe2ff 100%); }
#home .hm-bg::before { content: ""; position: absolute; inset: 0; pointer-events: none; background: var(--hs-sparkle); background-size: 83px 91px, 119px 127px, 151px 143px; opacity: .8; }
#home .hm-bg i { position: absolute; border-radius: 50%; background: radial-gradient(circle at 35% 30%, rgba(255,255,255,.95), rgba(255,190,220,.35) 60%, rgba(255,190,220,0) 72%); }
#home .hm-bg .b1 { width: 90px; height: 90px; left: 6%; top: 30%; }
#home .hm-bg .b2 { width: 54px; height: 54px; right: 10%; top: 24%; }
#home .hm-bg .b3 { width: 130px; height: 130px; right: -30px; top: 52%; opacity: .7; }
/* 右上:GEM と縦並びアイコン(.hm-row は箱を作らず、中身を .hm-top に直接並べる)*/
.hm-top { position: absolute; z-index: 20; right: calc(var(--sar) + 12px); top: calc(var(--sat) + 12px); width: 44px; }
.hm-row { display: contents; }
.hm-brand, .hm-player, .hm-reserve { display: none; }   /* ロゴ・プレイヤー名は出さない(キャラの表示領域を優先)*/
.hm-gem, .gt-gem { display: flex; align-items: center; gap: 5px; height: 32px; padding: 0 12px 0 8px; border-radius: 16px; border: 1px solid var(--hs-line); background: var(--hs-panel-strong); color: var(--hs-ink); box-shadow: var(--hs-shadow); font: 800 14px var(--round); font-variant-numeric: tabular-nums; white-space: nowrap; }
.hm-gem i, .gt-gem i { font-style: normal; color: var(--hs-pink); font-size: 15px; }
.hm-gem { position: absolute; right: 0; top: 0; z-index: 21; }
.hm-icons { position: absolute; right: 0; top: 42px; z-index: 22; width: 42px; display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }
.hm-icons button { position: relative; flex: 0 0 42px; width: 42px; height: 42px; margin: 0; display: grid; place-items: center; border-radius: 14px; border: 1px solid var(--hs-line); background: var(--hs-panel); color: var(--hs-pink-deep); box-shadow: var(--hs-shadow), inset 0 0 0 2px rgba(255,255,255,.7); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
.hm-icons button .ic { width: 21px; height: 21px; fill: none; stroke: currentColor; stroke-width: 1.65; }
.hm-icons .dot { position: absolute; top: 5px; right: 5px; width: 7px; height: 7px; border-radius: 50%; background: var(--hs-pink); box-shadow: 0 0 0 2px #fff; }
.hm-icons .clock { position: absolute; top: 2px; right: -2px; font-style: normal; font-size: 11px; }
/* キャラクター(全身)*/
.hm-char { position: absolute; z-index: 1; left: calc(var(--ax, .42) * 100%); bottom: calc(var(--navh) + var(--sab) + 94px); height: calc(62% * var(--sc, 1)); transform: translateX(-50%); aspect-ratio: 2 / 3; }
#home.no-pick .hm-char { bottom: calc(var(--navh) + var(--sab) + 8px); height: calc(68% * var(--sc, 1)); }
.hm-char img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; object-position: bottom; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
.hm-shadow { position: absolute; left: 8%; right: 8%; bottom: -8px; height: 34px; border-radius: 50%; background: radial-gradient(ellipse, rgba(255,110,170,.30), rgba(255,110,170,.10) 38%, transparent 72%); filter: blur(5px); }
.hm-char[data-idle="breathe"] img { animation: breathe2 3.6s ease-in-out infinite; transform-origin: 50% 100%; }
@keyframes breathe2 { 0%, 100% { transform: scale(1, 1); } 50% { transform: scale(1.006, 1.012); } }
.hm-char.react img { animation: hmreact .45s ease-out; }
@keyframes hmreact { 30% { transform: translateY(-8px) scale(1.01); } 60% { transform: translateY(0); } }
/* セリフ(顔の横)*/
.hm-bubble { position: absolute; z-index: 4; box-sizing: border-box; max-width: min(220px, 56%); padding: 10px 14px; border-radius: 18px; border: 1.5px solid var(--hs-pink-soft); background: var(--hs-panel-strong); color: var(--hs-ink); font: 800 14px/1.45 var(--round); box-shadow: var(--hs-shadow-lg), inset 0 0 0 3px rgba(255,240,246,.9); }
.hm-bubble::before { content: "♡"; position: absolute; left: 50%; top: -9px; transform: translateX(-50%); padding: 0 5px; border-radius: 8px; background: #fff; color: var(--hs-pink); font: 800 11px/1.4 var(--round); }
.hm-bubble p { margin: 0; }
.hm-bubble.linked { padding-right: 30px; border-color: var(--hs-pink); }
.hm-go { position: absolute; right: 10px; bottom: 9px; color: var(--hs-pink); font-size: 12px; }
.hm-bubble.in { animation: bubin .25s ease-out; }
@keyframes bubin { from { opacity: 0; transform: translateY(6px) scale(.96); } }
/* TODAY'S PICK(ナビの 20px 上)*/
.hm-pick { position: absolute; z-index: 14; left: calc(var(--sal) + 16px); right: calc(var(--sar) + 16px); bottom: calc(var(--navh) + var(--sab) + 20px); height: 68px; display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 18px; border: 1px solid rgba(139,108,240,.4); background: linear-gradient(135deg, #fff 55%, var(--heroine-soft)); color: var(--hs-ink); text-align: left; box-shadow: var(--hs-shadow-lg), inset 0 0 0 3px rgba(255,240,246,.9); }
.hm-pick::before { content: "✦ · ♡ · ✦"; position: absolute; left: 50%; top: -9px; transform: translateX(-50%); padding: 0 7px; border-radius: 8px; background: #fff; color: var(--hs-pink); font: 800 9px/1.6 var(--round); letter-spacing: 2px; white-space: nowrap; }
.hm-pick.linked { border-color: var(--hs-pink); box-shadow: 0 0 0 3px rgba(255,95,162,.18), var(--hs-shadow-lg); }
.pk-thumb { flex: none; width: 56px; height: 56px; border-radius: 12px; background-size: cover; background-position: calc(var(--fu, .5) * 100%) calc(var(--fv, .15) * 100%); box-shadow: 0 0 0 2px #fff, 0 0 0 3px var(--ac, var(--hs-pink-soft)), 0 4px 12px rgba(205,84,140,.25); }
.pk-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
.pk-h { display: flex; align-items: center; gap: 6px; font: 800 10px var(--round); letter-spacing: .12em; color: #6a4fd6; }
.pk-t { font-weight: 800; font-size: 15px; color: var(--hs-ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pk-t b { display: inline-block; font: 800 11px/1.5 var(--round); padding: 0 7px; border-radius: 8px; color: #fff; background: var(--dc); vertical-align: 1px; }
.pk-s { font-size: 11px; font-weight: 800; color: var(--hs-ink-soft); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pk-go { flex: none; min-height: 44px; display: grid; place-items: center; padding: 0 14px; border-radius: 22px; border: 1px solid rgba(255,255,255,.7); background: var(--hs-cta); color: #fff; font-weight: 800; font-size: 13px; box-shadow: 0 6px 16px rgba(255,79,154,.3); }

/* =====================================================================
   7. 汎用画面(育成 / コレクション / ミッション / プレゼント / 設定)
   ===================================================================== */
#appScreen { display: flex; flex-direction: column; }
#appScreen::before { content: ""; position: absolute; inset: 0; pointer-events: none; background: var(--hs-sparkle); background-size: 97px 113px, 137px 149px, 173px 181px; opacity: .7; }
.as-head { position: relative; flex: none; display: flex; align-items: center; gap: 6px; min-height: 52px; padding: calc(var(--sat) + 6px) calc(var(--sar) + 12px) 4px calc(var(--sal) + 8px); border-bottom: 1px solid var(--hs-line-soft); background: rgba(255,255,255,.72); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); }
.as-back { width: 44px; height: 44px; border: 0; background: none; font-size: 30px; line-height: 1; color: var(--hs-pink-deep); }
.as-title { flex: 1; font: 800 20px var(--round); padding-left: 8px; color: var(--hs-ink); }
.as-chip, .r-btn { min-height: 40px; padding: 0 14px; border-radius: 20px; border: 1px solid rgba(255,255,255,.7); background: var(--hs-cta); color: #fff; font-weight: 800; font-size: 13px; box-shadow: 0 6px 16px rgba(255,79,154,.24); }
.r-btn.ghost, .as-chip { background: #fff; color: var(--hs-pink-deep); border-color: var(--hs-line); box-shadow: var(--hs-shadow); }
.r-btn:disabled { background: #eadde4; color: #fff; box-shadow: none; }
.as-body { position: relative; flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; touch-action: pan-y; padding: 4px calc(var(--sar) + 16px) calc(var(--sab) + 16px) calc(var(--sal) + 16px); }
.as-lead { margin: 4px 0 12px; font-size: 12px; font-weight: 800; color: var(--hs-ink-soft); }
.as-lead b { color: var(--hs-pink-deep); }
.as-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.as-card { padding: 0; border: 0; background: none; min-width: 0; text-align: center; }
.as-card.unowned { position: relative; border-radius: 12px; border: 1px dashed var(--hs-line); background: rgba(255,255,255,.55); padding: 6px 4px 8px; display: flex; flex-direction: column; align-items: center; gap: 2px; }
.un-sil { width: 64%; aspect-ratio: 2/3; background-size: contain; background-repeat: no-repeat; background-position: center; filter: brightness(0) opacity(.18); }
.un-q { font: 800 14px var(--round); color: var(--hs-ink-soft); }
.un-how { font-size: 9px; font-weight: 800; color: var(--hs-ink-soft); }
.as-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.as-row { position: relative; display: flex; align-items: center; gap: 10px; min-height: 60px; padding: 8px 12px; border-radius: 16px; border: 1px solid var(--hs-line-soft); background: var(--hs-panel); box-shadow: var(--hs-shadow); }
.as-row.done { opacity: .6; }
.r-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.r-main b { font-size: 14px; color: var(--hs-ink); }
.r-main span { font-size: 11px; font-weight: 800; color: var(--hs-ink-soft); }
.r-main em.soon { font-style: normal; color: var(--hs-pink-deep); }
.r-bar { display: block; height: 6px; border-radius: 3px; background: var(--hs-pink-pale); box-shadow: inset 0 0 0 1px var(--hs-line-soft); overflow: hidden; }
.r-bar i { display: block; height: 100%; background: linear-gradient(90deg, #ff9cc8, #ff5fa2 60%, #c08bff); transform-origin: left; }
.r-tgl { min-width: 64px; min-height: 40px; border-radius: 20px; border: 1px solid var(--hs-line); background: #fff; font-weight: 800; color: var(--hs-ink-soft); }
.r-tgl.on { background: var(--hs-pink); border-color: var(--hs-pink); color: #fff; }
.snd-ctl { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center; margin-top: 4px; }
.snd-ctl input { width: 100%; min-height: 32px; accent-color: var(--hs-pink); touch-action: pan-x; }
.snd-ctl input:disabled { opacity: .4; }
.snd-ctl output { min-width: 52px; text-align: right; font-size: 12px; font-weight: 800; color: var(--hs-ink); font-variant-numeric: tabular-nums; }
.as-empty { margin: 40px 16px; text-align: center; font-weight: 800; color: var(--hs-ink-soft); line-height: 1.8; }
.as-note { font-size: 10px; color: var(--hs-ink-soft); text-align: center; }
.as-ver { margin-top: 24px; text-align: center; font-size: 11px; color: var(--hs-ink-soft); }

/* ---- キャラクターカード(育成・コレクション・編成・リザルト共通)---- */
.attr { color: color-mix(in srgb, var(--ac) 70%, var(--hs-ink)); font-weight: 800; white-space: nowrap; }
.ccard { --rc: #fff; --ac: #fff; position: relative; display: grid; grid-template-columns: minmax(0, 1fr); justify-items: center; gap: 1px; padding: 6px 4px 5px; min-width: 0; border-radius: 14px; border: 2px solid color-mix(in srgb, var(--rc) 70%, #fff); background: linear-gradient(180deg, color-mix(in srgb, var(--ac) 16%, #fff), #fff 72%); color: var(--hs-ink); font-size: 10px; box-shadow: var(--hs-shadow); }
.crank { position: absolute; left: 4px; top: 3px; padding: 0 5px; border-radius: 6px; background: var(--rc); color: #fff; font: 800 9px/1.5 var(--round); text-shadow: 0 1px 1px rgba(91,43,69,.35); }
.cslot { position: absolute; right: 3px; top: 3px; width: 18px; height: 18px; border-radius: 50%; background: var(--hs-pink); color: #fff; font: 800 10px var(--round); display: grid; place-items: center; box-shadow: 0 0 0 2px #fff; }
.cbadge { position: absolute; z-index: 2; left: 4px; top: 20px; font-size: 9px; font-weight: 800; padding: 0 5px; border-radius: 6px; white-space: nowrap; }
.cbadge.good { background: var(--hs-mint); color: #fff; }
.cbadge.bad { background: #cbbbd6; color: #fff; }
.avatar { position: relative; width: 48px; height: 48px; margin-top: 6px; border-radius: 50%; background-color: #fff; background-repeat: no-repeat; box-shadow: 0 0 0 2px #fff, 0 0 0 3.5px var(--ac); }
.avatar.ph { background: radial-gradient(circle at 35% 30%, #fff 0, color-mix(in srgb, var(--ac) 50%, #fff) 30%, var(--ac) 75%); display: grid; place-items: center; }
.avatar.ph span { font: 800 22px var(--round); color: #fff; text-shadow: 0 1px 2px rgba(91,43,69,.4); }
.avatar i { position: absolute; font-style: normal; font-size: 14px; right: -4px; bottom: -3px; }
.cname { font-weight: 800; font-size: 12px; margin-top: 3px; white-space: nowrap; }
.cmeta { display: flex; max-width: 100%; overflow: hidden; gap: 4px; align-items: center; font-weight: 800; font-size: 9px; color: color-mix(in srgb, var(--ac) 70%, var(--hs-ink)); }
.cstat { display: flex; max-width: 100%; gap: 5px; font-size: 9px; font-weight: 800; color: var(--hs-ink-soft); font-variant-numeric: tabular-nums; white-space: nowrap; }
.cstat-lv span:first-child { color: var(--hs-pink-deep); }
.cstat .chp { color: #e2557f; }
.ccard.compact .avatar { width: 38px; height: 38px; }
.ccard.compact .avatar.ph span { font-size: 17px; }
.ccard.compact .cstat { gap: 3px; justify-content: center; font-size: 8px; letter-spacing: -.02em; }
@media (max-width: 360px) {
  .ccard .cstat, .ccard .cmeta { gap: 0 2px; font-size: 7.5px; letter-spacing: -.03em; }
  .ccard .cstat { flex-wrap: wrap; justify-content: center; }
  .ccard.compact .cstat { gap: 0 2px; font-size: 7px; letter-spacing: -.05em; }
}

/* ---- 育成:上 = 編成 / 下 = 所持キャラクター(カードでキャラ画像が主役)---- */
.tl-sec { margin-top: 6px; }
.tl-sec + .tl-sec { margin-top: 16px; }
.tl-head { display: flex; align-items: baseline; gap: 8px; margin: 2px 2px 8px; }
.tl-head b { font: 800 16px var(--round); color: var(--hs-ink); }
.tl-head small { font-size: 10px; font-weight: 800; color: var(--hs-ink-soft); }
.tl-edit { margin-left: auto; min-height: 32px; padding: 0 12px; border-radius: 16px; border: 1px solid var(--hs-line); background: rgba(255,255,255,.85); color: var(--hs-pink-deep); font: 800 11px var(--round); }
.tl-party { display: grid; grid-template-columns: repeat(4, 1fr); gap: 7px; padding: 8px; border-radius: 22px; border: 1px solid var(--hs-line-soft); background: linear-gradient(160deg, rgba(255,255,255,.85), rgba(255,236,246,.75)); box-shadow: var(--hs-shadow); }
.tl-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 9px; }
.tl-card { position: relative; height: 176px; padding: 0; overflow: hidden; border-radius: 16px; border: 2px solid #fff; background: radial-gradient(ellipse at 50% 28%, #fff, color-mix(in srgb, var(--ac) 24%, var(--ally-soft)) 78%); box-shadow: var(--hs-shadow); text-align: left; color: var(--hs-ink); }
.tl-card.party { height: 150px; border-radius: 14px; }
/* 編成中は A/B/C/D のバッジ(.tl-in)だけで表す。外周(レアリティ枠)の色は変えない */
.tl-card.empty { display: grid; place-items: center; background: rgba(255,255,255,.55); border-style: dashed; border-color: var(--hs-line); box-shadow: none; }
.tl-card.empty span { font: 800 18px var(--round); color: var(--hs-line); }
.tl-art { position: absolute; inset: 0 0 50px 0; }
.tl-art img { position: absolute; left: 50%; top: 3px; height: 170%; max-width: none; transform: translateX(-50%); object-fit: contain; object-position: 50% 0; -webkit-user-drag: none; }
.tl-card.party .tl-art { bottom: 40px; }
.tl-rank { position: absolute; left: 6px; top: 6px; padding: 0 6px; border-radius: 7px; background: var(--rc); color: #fff; font: 800 9px/1.6 var(--round); text-shadow: 0 1px 1px rgba(91,43,69,.35); }
.tl-in { position: absolute; right: 5px; top: 5px; display: inline-flex; align-items: center; gap: 2px; padding: 0 6px 0 2px; border-radius: 10px; background: var(--hs-pink); color: #fff; font: 800 10px/18px var(--round); box-shadow: 0 3px 8px rgba(255,79,154,.35); }
.tl-in i { display: grid; place-items: center; width: 14px; height: 14px; border-radius: 50%; background: #fff; color: var(--hs-pink-deep); font-style: normal; font-size: 9px; line-height: 1; }
.tl-home { position: absolute; left: 6px; top: 26px; display: grid; place-items: center; width: 20px; height: 20px; border-radius: 50%; background: rgba(255,255,255,.92); color: var(--hs-pink-deep); font-size: 12px; box-shadow: 0 2px 6px rgba(205,84,140,.25); }
.tl-info { position: absolute; left: 0; right: 0; bottom: 0; display: grid; grid-template-columns: 1fr auto; align-items: baseline; gap: 0 4px; padding: 5px 7px 6px; background: rgba(255,255,255,.93); border-top: 1px solid var(--hs-line-soft); }
.tl-name { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; font-size: 12px; }
.tl-lv { font-size: 9px; font-weight: 800; color: var(--hs-pink-deep); }
.tl-lv b { font-size: 12px; }
.tl-type { grid-column: 1 / -1; font-size: 9px; font-weight: 800; color: color-mix(in srgb, var(--ac) 65%, var(--hs-ink)); white-space: nowrap; overflow: hidden; }
.tl-row { grid-column: 1 / -1; display: flex; align-items: center; justify-content: space-between; gap: 4px; min-width: 0; }
.tl-hp { flex: none; font-size: 9px; font-weight: 800; color: #e2557f; }
.tl-row .stam { gap: 3px; min-width: 0; }
.tl-row .stam i { width: 14px; }
.tl-hp b { font-weight: 900; }
.tl-card.party .tl-hp { display: none; }
.tl-info .stam { grid-column: 1 / -1; }
.tl-card.party .tl-info { padding: 4px 5px 5px; }
.tl-card.party .tl-name { font-size: 11px; }
.tl-card.party .tl-type, .tl-card.party .stam b { display: none; }
.tl-card.party .stam i { width: 100%; }

/* ---- 育成:キャラクター詳細(画面全体がキャラ。右に情報パネル、下に操作ボタン)---- */
#appScreen[data-screen="trainChar"] .as-head { position: absolute; z-index: 6; left: 0; right: 0; top: 0; border-bottom: 0; background: linear-gradient(180deg, rgba(255,255,255,.7), rgba(255,255,255,0)); backdrop-filter: none; -webkit-backdrop-filter: none; }
#appScreen[data-screen="trainChar"] .as-body, #game.nav-on #appScreen[data-screen="trainChar"] .as-body { overflow: hidden; padding: 0; }
.td { position: absolute; left: 0; right: 0; top: 0; bottom: calc(var(--navh) + var(--sab)); overflow: hidden; }
.td-bg { position: absolute; inset: 0; background: radial-gradient(ellipse 80% 55% at 36% 34%, #fff 0%, color-mix(in srgb, var(--ac) 20%, #fff0f6) 55%, color-mix(in srgb, var(--ac) 32%, #f3e9ff) 100%); }
.td-bg::after { content: ""; position: absolute; inset: 0; background: var(--hs-sparkle); background-size: 97px 113px, 137px 149px, 173px 181px; opacity: .8; }
.td-art { position: absolute; inset: 0; touch-action: pan-y; }
.td-art img { position: absolute; left: 31%; top: 44px; height: calc(100% - 4px); max-width: none; transform: translateX(-50%); object-fit: contain; object-position: 50% 0; -webkit-user-drag: none; filter: drop-shadow(0 10px 24px rgba(140,50,95,.18)); }
.td-art img.react { animation: hmreact .45s ease-out; }
.td-bubble { z-index: 4; left: 8%; right: auto; top: 16%; max-width: 48%; }
.td-nav { position: absolute; z-index: 5; top: 44%; width: 36px; height: 56px; border: 1px solid rgba(255,255,255,.85); border-radius: 18px; background: rgba(255,255,255,.55); color: var(--hs-pink-deep); font: 800 26px/1 var(--round); box-shadow: var(--hs-shadow); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
.td-nav.prev { left: calc(var(--sal) + 6px); }
.td-nav.next { right: calc(var(--sar) + 12px + clamp(124px, 35%, 136px)); }   /* 右の列(プレート・必殺技・ステータス)にかからないよう、列のすぐ左 */
.td-side { position: absolute; z-index: 3; right: calc(var(--sar) + 6px); top: calc(var(--sat) + 54px); bottom: 56px; width: clamp(124px, 35%, 136px); align-items: flex-end; display: flex; flex-direction: column; justify-content: space-between; gap: 8px; pointer-events: none; }
.td-plate, .td-panel { position: relative; pointer-events: auto; padding: 7px 8px; border-radius: 14px; border-radius: 18px; border: 1px solid rgba(255,255,255,.9); background: linear-gradient(160deg, rgba(255,255,255,.82), rgba(255,240,247,.7)); box-shadow: var(--hs-shadow); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
.td-badges { display: flex; flex-wrap: wrap; gap: 2px; }
.td-rank { padding: 0 4px; border-radius: 5px; background: var(--rc); color: #fff; font: 800 8px/1.75 var(--round); text-shadow: 0 1px 1px rgba(91,43,69,.35); }
.td-attr, .td-type { padding: 0 3px; border-radius: 5px; background: rgba(255,255,255,.9); box-shadow: inset 0 0 0 1px var(--hs-line-soft); font: 800 7.5px/1.9 var(--round); color: color-mix(in srgb, var(--ac) 60%, var(--hs-ink)); }
.td-name { margin: 3px 0 0; font: 800 18px/1.15 var(--round); color: var(--hs-ink); letter-spacing: .02em; }
.td-lv { display: flex; flex-wrap: wrap; align-items: baseline; gap: 0 5px; margin-top: 2px; }
.td-lv small { font: 800 8px var(--round); letter-spacing: .1em; color: var(--hs-pink-deep); }
.td-lv b { font: 800 18px var(--round); background: linear-gradient(135deg, #ff6aa8, #b07cff); -webkit-background-clip: text; background-clip: text; color: transparent; }
.td-lv em { font-style: normal; font-size: 10px; font-weight: 800; color: var(--hs-pink-deep); }
.td-exp { display: grid; gap: 2px; margin-top: 2px; }
.td-exp small { justify-self: end; font-size: 8px; font-weight: 800; color: var(--hs-ink-soft); }
.td-chips { display: flex; flex-wrap: wrap; gap: 2px; margin-top: 3px; }
.td-chip { padding: 0 5px; border-radius: 8px; font: 800 8px/16px var(--round); white-space: nowrap; }
.td-chip.in { background: var(--hs-pink); color: #fff; }
.td-chip.home { background: #fff; color: var(--hs-pink-deep); box-shadow: inset 0 0 0 1.5px var(--hs-pink-soft); }
.td-plate { width: 100%; box-sizing: border-box; }
.td-panel { width: 100%; box-sizing: border-box; display: grid; gap: 4px; min-height: 0; padding: 0; border: 0; background: none; box-shadow: none; backdrop-filter: none; -webkit-backdrop-filter: none; }
/* 五角形はパネルに入れず、五角形そのものをガラスにする(角の部分はキャラが見える)*/
.td-meta { padding: 5px 7px 6px; border-radius: 12px; border: 1px solid rgba(255,255,255,.9); background: linear-gradient(160deg, rgba(255,255,255,.84), rgba(255,240,247,.72)); box-shadow: var(--hs-shadow); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); display: grid; gap: 3px; }
/* ステータスの五角形(ガラスの段 + 発光するグラデーション + 頂点のラベルと実数値)*/
.td-radar { margin: 0 -2px; }
.rd { display: block; width: 100%; height: auto; overflow: visible; }
.rd-bg { stroke: rgba(255,255,255,.98); stroke-width: 1.6; filter: drop-shadow(0 2px 8px rgba(205,84,140,.35)); }
.rd-ring { fill: none; stroke: rgba(231,168,181,.55); stroke-width: .8; stroke-dasharray: 2 2; }
.rd-axis { stroke: rgba(231,168,181,.5); stroke-width: .8; }
.rd-data { stroke: #ff5fa2; stroke-width: 1.6; stroke-linejoin: round; }
.rd-dot { fill: #fff; stroke: #ff5fa2; stroke-width: 1.4; }
.rd-name, .rd-val { font-family: var(--round); font-weight: 800; paint-order: stroke; stroke: rgba(255,255,255,.95); stroke-width: 3px; stroke-linejoin: round; }
.rd-name { font-size: 8px; letter-spacing: 0; fill: #9b6f87; }
.rd-val { font-size: 12px; fill: var(--hs-ink); }
.rd-l[data-stat="hp"] .rd-val { fill: #ec3f8a; }
.rd-l[data-stat="attack"] .rd-name { fill: #e0478f; }
.rd-l[data-stat="defence"] .rd-name { fill: #2ea6e6; }
.rd-l[data-stat="control"] .rd-name { fill: #2bb36a; }
.rd-l[data-stat="curve"] .rd-name { fill: #8b5cf0; }
.td-stamrow { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 4px; font: 800 8px var(--round); color: var(--hs-ink-soft); letter-spacing: .04em; }
.td-stamrow .tc-bar { height: 5px; }
.td-stamrow small { font-size: 8px; } .td-stamrow small b { font-size: 10px; color: var(--hs-ink); }
.td-stam.tired .td-stamrow .tc-bar.stam i { background: #d9cbd6; }
.td-stam p { margin: 1px 0 0; font-size: 8px; line-height: 1.3; font-weight: 800; color: var(--hs-ink-soft); }
.td-stam.tired p { color: #b0507f; }
.td-abil small { display: flex; align-items: center; gap: 4px; font: 800 8px var(--round); letter-spacing: .14em; color: var(--hs-pink-deep); }
.td-abnew { padding: 0 4px; border-radius: 6px; background: var(--hs-pink); color: #fff; font-style: normal; font-size: 7px; letter-spacing: .04em; line-height: 13px; }
.td-abs { display: flex; flex-wrap: wrap; gap: 2px; margin-top: 1px; max-height: 52px; overflow: hidden; }
.td-ab { padding: 0 5px; border-radius: 7px; background: #fff; box-shadow: inset 0 0 0 1px var(--hs-line-soft); font: 800 8px/16px var(--round); color: var(--hs-ink); white-space: nowrap; }
.td-ab.ult { background: linear-gradient(120deg, #fff4fb, #efe7ff); }
.td-ab.new { background: var(--hs-pink); color: #fff; box-shadow: none; }
.td-ab.none { color: var(--hs-ink-soft); }
.td-ab.more { background: var(--hs-pink-pale); color: var(--hs-pink-deep); }
.td-special { position: relative; pointer-events: auto; width: 100%; min-height: 40px; box-sizing: border-box; display: grid; grid-template-columns: minmax(0, 1fr) auto; grid-template-rows: auto auto; align-items: center; gap: 1px 4px; padding: 5px 6px 6px 8px; border-radius: 14px;
  border: 1px solid rgba(255,255,255,.95); background: linear-gradient(155deg, rgba(255,255,255,.9), rgba(255,236,246,.85)); box-shadow: var(--hs-shadow), inset 0 0 0 1.5px rgba(255,150,200,.35);
  backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); color: var(--hs-ink); font-family: var(--round); text-align: left; cursor: pointer; }
.td-special small { justify-self: start; grid-column: 1; padding: 0 5px; border-radius: 6px; background: linear-gradient(135deg, #ff8cc6, #ff5fa2); color: #fff; font: 900 7.5px/1.5 var(--round); letter-spacing: .08em; }
.td-special .tsp-name { grid-column: 1; min-width: 0; font: 900 11px/1.15 var(--display, var(--round)); color: #6b2a57; overflow-wrap: anywhere; }
.td-special .tsp-go { grid-column: 2; grid-row: 1 / 3; font-style: normal; font: 900 16px/1 var(--round); color: var(--hs-pink-deep); }
.td-special:active { transform: scale(.98); }
.td-special[data-effect="healAll"] small { background: linear-gradient(135deg, #f3c55a, #e0a335); }
.td-special[data-effect="healAll"] { box-shadow: var(--hs-shadow), inset 0 0 0 1.5px rgba(232,190,90,.55); }
.sp-sheet { display: grid; gap: 8px; padding: 2px 2px 6px; text-align: center; }
.sp-sheet .sp-chara { font-weight: 800; color: var(--hs-ink-soft); }
.sp-sheet .sp-name { margin: 0; font: 900 22px var(--display, var(--round)); color: #6b2a57; letter-spacing: .03em; }
.sp-sheet .sp-dia { justify-self: center; display: flex; align-items: center; gap: 4px; padding: 3px 12px; border-radius: 999px; background: #fff; box-shadow: inset 0 0 0 1.5px var(--hs-pink-soft, #ffc2df); font: 800 12px var(--round); color: var(--hs-ink); }
.sp-sheet .sp-dia i { font-style: normal; font-size: 14px; }
.sp-sheet .sp-dia b { font: 900 16px var(--round); color: var(--hs-pink-deep, #e0418a); }
.sp-sheet .sp-hl { justify-self: center; display: flex; align-items: baseline; gap: 6px; padding: 6px 16px; border-radius: 14px; background: linear-gradient(135deg, #ff8cc6, #ff5fa2); color: #fff; box-shadow: 0 4px 14px rgba(255,95,162,.35); }
.sp-sheet[data-effect="healAll"] .sp-hl { background: linear-gradient(135deg, #f3c55a, #e0a335); box-shadow: 0 4px 14px rgba(224,163,53,.4); }
.sp-sheet .sp-hl b { font: 900 20px var(--round); }
.sp-sheet .sp-hl span { font: 900 11px var(--round); letter-spacing: .1em; }
.sp-sheet .sp-desc { margin: 0; font-size: 14px; font-weight: 800; line-height: 1.7; color: var(--hs-ink); }
.sp-sheet .sp-note, .sp-sheet .sp-base { margin: 0; font-size: 11.5px; font-weight: 800; color: var(--hs-ink-soft); }
.td-actions { position: absolute; z-index: 4; right: calc(var(--sar) + 6px); bottom: 6px; display: grid; grid-template-columns: repeat(3, 70px); gap: 5px; }
.td-actions button { position: relative; min-height: 46px; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 1px; padding: 0 2px; border-radius: 16px; border: 1px solid rgba(255,255,255,.9); background: rgba(255,255,255,.78); color: var(--hs-pink-deep); font: 800 10px var(--round); white-space: nowrap; box-shadow: var(--hs-shadow); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
.td-actions button i { font-style: normal; font-size: 14px; line-height: 1; }
